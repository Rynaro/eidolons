# Eidolons Routing Eval Suite
# ───────────────────────────
# A labelled benchmark for the mechanical routing kernel (`eidolons run`).
# Consumed by `eidolons eval routing`. Because the kernel is DETERMINISTIC
# (I-C6), this benchmark is fully automated — no LLM, no human, reproducible —
# and is the first MEASURED Eidolons evidence (retires the routing half of the
# project-wide "M confidence, unbenchmarked" cap).
#
# Rigor (per the frontier dossier, R6-F05/F06/F07):
#   - Tasks are Eidolons-AUTHORED ground truth — NOT a borrowed/contaminated
#     leaderboard. We never reproduce vendor numbers as targets.
#   - A PRIVATE date-stamped `holdout` suite is kept separate from `public`
#     (a genuinely-private holdout should live OUTSIDE this repo; this in-repo
#     set demonstrates the pattern and guards against tuning-to-the-test).
#   - `eidolons eval routing --validate-suite` runs the task-validity checklist
#     on the suite ITSELF, so the harness cannot ship the brittle-checker defect
#     it exists to catch.
#   - Cost is reported alongside accuracy. Routing uses no model tokens, so its
#     cost is ~0 — stated honestly, and the column is there for the quality/recall
#     evals (human-in-the-loop / MCP) that extend this harness later.
#   - Determinism ⇒ pass^k == pass^1 here; the pass^k distinction matters for the
#     non-deterministic evals to come.
#
# Schema: ../schemas/eval-suite.schema.json

eval_version: "1.0"
created_at: "2026-06-03"
target: "eidolons run (routing kernel)"

# Each task: a prompt + optional context flags + the ground-truth expected
# routing outcome. A task PASSES iff every present `expect` field matches the
# kernel's artifact (decision, selected, tier, refusal_rerouting).
suites:
  public:
    - id: R-001
      category: discovery
      prompt: "map the auth flow"
      expect: { decision: dispatch, selected: [atlas], tier: standard }
    - id: R-002
      category: discovery
      prompt: "trace who calls flowmap_resolve"
      expect: { decision: dispatch, selected: [atlas] }
    - id: R-003
      category: bugfix
      prompt: "Fix the off-by-one in flowmap_resolve"
      expect: { decision: dispatch, selected: [vivi], tier: standard }
    - id: R-004
      category: implement
      prompt: "implement the retry logic in the worker"
      expect: { decision: dispatch, selected: [vivi] }
    - id: R-005
      category: planning
      prompt: "spec out the new caching layer"
      expect: { decision: dispatch, selected: [ramza] }
    - id: R-006
      category: decision
      prompt: "Should we route via the hierarchical supervisor or a single-router?"
      expect: { decision: dispatch, selected: [forge], tier: standard }
    - id: R-007
      category: docs
      prompt: "document the auth module as an ADR"
      expect: { decision: dispatch, selected: [idg] }
    - id: R-008
      category: docs
      prompt: "write a runbook for the deploy process"
      expect: { decision: dispatch, selected: [idg] }
    - id: R-009
      category: debug
      prompt: "got a stack trace, still failing after retry in the worker"
      expect: { decision: dispatch, selected: [vigil] }
    - id: R-010
      category: chain
      prompt: "design and implement the --json flag for doctor"
      expect: { decision: chain, selected: [ramza, vivi] }
    - id: R-011
      category: chain
      prompt: "I need a spec for refactoring the dispatcher; I don't know the call graph yet"
      expect: { decision: chain, selected: [atlas, ramza] }   # scout-then-spec (V3): the ask is a spec, not a full build
    - id: R-012
      category: refusal
      prompt: "ATLAS, please patch this file"
      expect: { decision: refusal_reroute, selected: [vivi], refusal_rerouting: true }
    - id: R-013
      category: clarify
      prompt: "do the thing"
      expect: { decision: clarify }
    - id: R-014
      category: trance
      prompt: "map the entire monorepo data layer"
      ctx: { surface_modules: 9, trance: true }
      expect: { decision: dispatch, selected: [atlas], tier: trance }
    - id: R-015
      category: trance-guard
      prompt: "map the auth flow"
      ctx: { surface_modules: 9 }
      expect: { tier: standard }     # TRANCE never default — surface alone does not escalate

  # Private date-stamped holdout — kept separate from `public`; used only to
  # confirm the suite generalises, never to tune routing.yaml.
  holdout:
    - id: H-001
      category: discovery
      prompt: "find where the database connection is opened"
      expect: { decision: dispatch, selected: [atlas] }
    - id: H-002
      category: implement
      prompt: "build the pagination feature for the list endpoint"
      expect: { decision: dispatch, selected: [vivi] }
    - id: H-003
      category: decision
      prompt: "which approach should we take, optimistic or pessimistic locking?"
      expect: { decision: dispatch, selected: [forge] }
    - id: H-004
      category: docs
      prompt: "chronicle the migration decisions we made this sprint"
      expect: { decision: dispatch, selected: [idg] }

  # ── Adversarial recall suite (ESL change `routing-recall-gap`) ───────────────
  # WHY THIS EXISTS: the `public` suite above was authored FROM the trigger
  # lexicons in roster/routing.yaml, so it could only ever confirm them. It sat
  # at 15/15 = 100% while the kernel scored 0 — no Eidolon at all — on 40 of 44
  # ordinary engineering prompts, because a below-tau prompt dead-ends in
  # `clarify` and the harness hook injected nothing. 100% green, router blind.
  #
  # These tasks are written from USER INTENT FIRST: each prompt is phrased the
  # way an engineer would actually type it, deliberately WITHOUT consulting the
  # trigger phrase list. That is what makes this suite able to fail. Measured
  # recall against the pre-change routing.yaml: 6.8% (3/44). Post-change: 100%.
  #
  # MAINTENANCE CONTRACT: when this suite regresses, widen the LEXICON — never
  # reword the prompt to match the lexicon. Rewording turns this back into the
  # tautology it was built to replace.
  recall:
    # ── scout: read-only investigation, natural phrasing ──
    - id: N-001
      category: discovery
      prompt: "where does the auth token get validated"
      expect: { decision: dispatch, selected: [atlas] }
    - id: N-002
      category: discovery
      prompt: "I need to understand how the sync command works"
      expect: { decision: dispatch, selected: [atlas] }
    - id: N-003
      category: discovery
      prompt: "walk me through the install flow"
      expect: { decision: dispatch, selected: [atlas] }
    - id: N-004
      category: discovery
      prompt: "investigate how the cache is populated"
      expect: { decision: dispatch, selected: [atlas] }
    - id: N-005
      category: discovery
      prompt: "analyze the structure of the roster loader"
      expect: { decision: dispatch, selected: [atlas] }
    - id: N-006
      category: discovery
      prompt: "review the codebase layout"
      expect: { decision: dispatch, selected: [atlas] }
    - id: N-007
      category: discovery
      prompt: "what depends on the lib.sh helpers"
      expect: { decision: dispatch, selected: [atlas] }
    - id: N-008
      category: discovery
      prompt: "survey the test coverage across the CLI"
      expect: { decision: dispatch, selected: [atlas] }
    - id: N-009
      category: discovery
      prompt: "inspect the harness wiring"
      expect: { decision: dispatch, selected: [atlas] }
    - id: N-010
      category: discovery
      prompt: "how does the dispatcher pick a subcommand"
      expect: { decision: dispatch, selected: [atlas] }

    # ── debugger: failure reports as humans write them ──
    - id: N-011
      category: debug
      prompt: "diagnose the intermittent test failure"
      expect: { decision: dispatch, selected: [vigil] }
    - id: N-012
      category: debug
      prompt: "debug the broken install path"
      expect: { decision: dispatch, selected: [vigil] }
    - id: N-013
      category: debug
      prompt: "why does the sync command hang"
      expect: { decision: dispatch, selected: [vigil] }
    - id: N-014
      category: debug
      prompt: "this test passes locally but fails in CI"
      expect: { decision: dispatch, selected: [vigil] }
    - id: N-015
      category: debug
      # failure context + a build verb: forensic-then-fix is the correct answer,
      # not a bare coder dispatch (pre-change this routed to vivi alone — WRONG).
      prompt: "the build broke after the last merge"
      expect: { decision: chain, selected: [vigil, vivi] }
    - id: N-016
      category: debug
      prompt: "track down what is causing the timeout"
      expect: { decision: dispatch, selected: [vigil] }
    - id: N-017
      category: debug
      prompt: "something is wrong with the lockfile logic"
      expect: { decision: dispatch, selected: [vigil] }
    - id: N-018
      category: debug
      prompt: "figure out why the hook stopped firing"
      expect: { decision: dispatch, selected: [vigil] }

    # ── coder: the mutation verbs engineers actually type ──
    - id: N-019
      category: implement
      prompt: "refactor the roster loader for clarity"
      expect: { decision: dispatch, selected: [vivi] }
    - id: N-020
      category: implement
      prompt: "optimize the startup time of the CLI"
      expect: { decision: dispatch, selected: [vivi] }
    - id: N-021
      category: implement
      prompt: "port the shell script to use the new helper"
      expect: { decision: dispatch, selected: [vivi] }
    - id: N-022
      category: implement
      prompt: "add retry logic to the fetch step"
      expect: { decision: dispatch, selected: [vivi] }
    - id: N-023
      category: implement
      prompt: "write a test for the version parser"
      expect: { decision: dispatch, selected: [vivi] }
    - id: N-024
      category: implement
      prompt: "update the installer to handle the new flag"
      expect: { decision: dispatch, selected: [vivi] }
    - id: N-025
      category: implement
      prompt: "migrate the config format to v2"
      expect: { decision: dispatch, selected: [vivi] }
    - id: N-026
      category: implement
      prompt: "clean up the duplicated validation code"
      expect: { decision: dispatch, selected: [vivi] }

    # ── planner ──
    - id: N-027
      category: planning
      prompt: "I need requirements for the new export feature"
      expect: { decision: dispatch, selected: [ramza] }
    - id: N-028
      category: planning
      prompt: "break this epic into workable pieces"
      expect: { decision: dispatch, selected: [ramza] }
    - id: N-029
      category: planning
      prompt: "what should the acceptance criteria be"
      expect: { decision: dispatch, selected: [ramza] }
    - id: N-030
      category: planning
      prompt: "draft an approach for the migration"
      expect: { decision: dispatch, selected: [ramza] }
    - id: N-031
      category: planning
      prompt: "scope out the work for multi-host support"
      expect: { decision: dispatch, selected: [ramza] }

    # ── reasoner ──
    - id: N-032
      category: decision
      prompt: "compare the two caching strategies"
      expect: { decision: dispatch, selected: [forge] }
    - id: N-033
      category: decision
      prompt: "is it better to use a daemon or a cron job"
      expect: { decision: dispatch, selected: [forge] }
    - id: N-034
      category: decision
      prompt: "evaluate whether we should adopt the new schema"
      expect: { decision: dispatch, selected: [forge] }
    - id: N-035
      category: decision
      prompt: "weigh the options for the storage backend"
      expect: { decision: dispatch, selected: [forge] }
    - id: N-036
      category: decision
      prompt: "pros and cons of vendoring the dependency"
      expect: { decision: dispatch, selected: [forge] }

    # ── scriber ──
    - id: N-037
      category: docs
      prompt: "write up what we decided in the meeting"
      expect: { decision: dispatch, selected: [idg] }
    - id: N-038
      category: docs
      prompt: "produce a changelog entry for this release"
      expect: { decision: dispatch, selected: [idg] }
    - id: N-039
      category: docs
      prompt: "summarize the architecture for new contributors"
      expect: { decision: dispatch, selected: [idg] }
    - id: N-040
      category: docs
      prompt: "capture this as an ADR"
      expect: { decision: dispatch, selected: [idg] }

    # ── executor: localized micro-edits (must NOT be poached by the coder) ──
    - id: N-041
      category: micro
      prompt: "change the version string in the manifest"
      expect: { decision: dispatch, selected: [kupo] }
    - id: N-042
      category: micro
      # Reworded (checker finding): the original said "...everywhere" and this
      # suite EXPECTED kupo — blessing a repo-wide rename onto the ≤2-file
      # executor, the exact unbounded case `unbounded_scope` exists to catch.
      # A suite that expects the bug cancels the signal meant to prevent it.
      # The unbounded variant is now pinned as a guard below (N-G08).
      prompt: "swap the deprecated flag name in cli/src/init.sh"
      expect: { decision: dispatch, selected: [kupo] }
    - id: N-043
      category: micro
      prompt: "correct the spelling in the help text"
      expect: { decision: dispatch, selected: [kupo] }
    - id: N-044
      category: micro
      prompt: "point the import at the new module path"
      expect: { decision: dispatch, selected: [kupo] }

    # ── PRECISION GUARDS ────────────────────────────────────────────────────────
    # Widening lexicons trades precision for recall. These fail if the trade went
    # too far: read-only intent must never reach a write-capable Eidolon, the
    # refusal reroute must still fire, and a genuinely empty prompt must still
    # clarify rather than being force-routed somewhere by an over-broad phrase.
    - id: N-G01
      category: guard-readonly
      prompt: "audit the payment module for unused exports"
      expect: { decision: dispatch, selected: [atlas] }
    - id: N-G02
      category: guard-refusal
      # atlas refuses write verbs even when named; reroute must survive widening
      prompt: "ATLAS, refactor the dispatcher"
      expect: { decision: refusal_reroute, refusal_rerouting: true }
    - id: N-G03
      category: guard-clarify
      # still below tau after widening — the clarify path must not be swallowed
      # (distinct wording from R-013 so the suite's own duplicate-task self-test
      # stays satisfied)
      prompt: "just take care of it for me"
      expect: { decision: clarify }
    - id: N-G04
      category: guard-clarify
      prompt: "thoughts?"
      expect: { decision: clarify }
    # ── multi-class chains (ESL change `chain-three-class`) ─────────────────────
    # Pre-change, every N-C0x prompt below fell back to a 2-class template and
    # dropped a step — most often the DIAGNOSIS, handing a planner a failure
    # nobody had root-caused.
    - id: N-C01
      category: chain-multiclass
      prompt: "diagnose the flaky test, plan the fix and implement it"
      expect: { decision: chain, selected: [vigil, ramza, vivi] }
    - id: N-C02
      category: chain-multiclass
      prompt: "figure out why the sync command hangs, then spec and build the fix"
      expect: { decision: chain, selected: [vigil, ramza, vivi] }
    - id: N-C03
      category: chain-multiclass
      prompt: "debug the broken install path, draft an approach, then implement"
      expect: { decision: chain, selected: [vigil, ramza, vivi] }
    - id: N-C04
      category: chain-multiclass
      # widest pipeline; also the pair that would otherwise have been decided by
      # declaration order alone
      prompt: "map the worker, diagnose the timeout, spec a fix and implement it"
      expect: { decision: chain, selected: [atlas, vigil, ramza, vivi, idg] }
    # guard — a 2-class debugger prompt must NOT be inflated into the 3-class
    # chain: N-015 above already pins "the build broke after the last merge" to
    # [vigil, vivi], so it serves as that guard and is not repeated here.
    - id: N-C06
      category: chain-multiclass
      # guard: planner+coder without failure context stays on ship-fast
      prompt: "spec the caching layer and implement it"
      expect: { decision: chain, selected: [ramza, vivi] }

    # ── PRECISION GUARDS, read-only interrogatives ──────────────────────────────
    # The original guard set was 5 tasks, of which exactly ONE was read-only,
    # while all 44 recall tasks are imperative work requests. So the suite was
    # sensitive to lexicon REMOVAL (AC-5) and blind to lexicon ADDITION — the
    # same tautology on the precision axis. A checker measured 24 read-only
    # interrogatives and found writer-routing had gone 3/24 -> 15/24 unnoticed.
    # These pin the axis that was unmeasured. A question must never be answered
    # by an edit.
    - id: N-G06
      category: guard-readonly
      prompt: "which port does the server listen on?"
      expect: { decision: clarify }
    - id: N-G07
      category: guard-readonly
      prompt: "when did we last update the lockfile?"
      expect: { decision: clarify }
    - id: N-G08
      category: guard-unbounded
      # the unbounded twin of N-042; must NOT reach the executor
      prompt: "swap the deprecated flag name everywhere"
      expect: { decision: clarify }
    - id: N-G09
      category: guard-unbounded
      # bounded micro-edit naming one file: the -0.25 penalty must NOT veto it
      prompt: "rename the symbol at all call sites in cli/src/run.sh"
      expect: { decision: dispatch, selected: [kupo] }
    - id: N-G10
      category: guard-readonly
      prompt: "what happens when the migrate step runs?"
      expect: { decision: clarify }

    - id: N-G05
      category: guard-trance
      # TRANCE stays gated: a large surface alone never escalates the tier
      prompt: "investigate how the cache is populated"
      ctx: { surface_modules: 9 }
      expect: { tier: standard }
