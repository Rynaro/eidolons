# Eidolons Routing Data — machine-readable cortex
# ────────────────────────────────────────────────
# Single source of truth for `eidolons run` — the mechanical routing kernel.
# This file makes the EIDOLONS.md descriptor table + dispatch protocol
# DETERMINISTIC: the kernel reads these fields and table-matches, rather than a
# host LLM interpreting prose. Mirrors EIDOLONS.md §"Roster Index" and
# §"Dispatch Protocol"; `eidolons doctor --deep` is the planned drift gate.
#
# Schema: ../schemas/routing.schema.json
# Sibling to roster/index.yaml (the member registry) and roster/mcps.yaml.
#
# Invariant I-C6: same prompt + same context + same routing data ⇒ same routing.
# Invariant I-C2: this is DATA. The kernel interprets it; there is no eval.
#
# Model tiers: the SOLE tier source is this file (single source of truth).
# Vendor model strings live ONLY in roster/model-profiles.yaml (PD #162).
# Tier ladder: light < standard < deep.

routing_version: "1.1"
updated_at: "2026-07-05T20:45Z"

# ─── Gate thresholds (Dispatch Protocol Step 2 / TRANCE Step 4) ─────────────────
thresholds:
  tau_standard: 0.6        # min top-score to dispatch a single Eidolon (OQ-2)
  tau_trance: 0.8          # min score that, WITH a stakes flag, may escalate tier
  chain_floor: 0.6         # min score for a second Eidolon to co-trigger a chain
  max_reroutes: 2          # OQ-6 reroute cap (anti ping-pong)
  max_parallel: 5          # TRANCE cost ceiling C1
  surface_files: 25        # large-surface complexity flag (C5)
  surface_modules: 5

# ─── TRANCE model-tier split (EIDOLONS.md §TRANCE) ───────────────────────────
# lead_tier / workers_tier are vendor-neutral tier words (light|standard|deep).
# Computed artifact data — replaces the EIDOLONS.md §TRANCE prose "model-tier
# upgrade (lead=deep, workers=light)". The kernel surfaces model_tier_lead /
# model_tier_workers on the artifact only when tier == "trance" (fail-open:
# absent block → fields omitted, not defaulted).
trance:
  lead_tier: deep
  workers_tier: light

# ─── Class-level tier defaults ───────────────────────────────────────────────
# Used by the model resolver when a given Eidolon has no per-id suggested_tier.
# 'default' applies to unknown / future capability classes.
classes:
  default:
    suggested_tier: standard

# ─── Per-Eidolon routing descriptors (mirror EIDOLONS.md trigger/refuses) ───────
# suggested_tier: vendor-neutral tier (light|standard|deep). The active profile
# in roster/model-profiles.yaml maps tier → concrete model string.
# score = (# distinct trigger phrases matched in the prompt). Refusal is checked
# against refuse_verbs.
eidolons:
  atlas:
    capability_class: scout
    suggested_tier: standard
    # Recall pass (routing-recall-gap): the original list matched only the
    # cortex's own vocabulary, so natural read-only phrasings ("where does X
    # happen", "walk me through Y", "investigate Z") scored 0 and dead-ended in
    # `clarify`. Additions below are all READ-ONLY intent, so a false positive
    # lands on the safest member of the roster.
    trigger_verbs: ["map", "trace", "find where", "who calls", "call graph", "list entrypoints", "entrypoints", "audit", "explore", "where is", "scout", "understand the codebase", "make sense of", "where does", "how does", "how is", "walk me through", "investigate", "analyze", "inspect", "survey", "what depends on", "what uses", "read through", "look into", "understand how", "understand", "review the", "figure out how", "show me how", "what calls"]
    refuse_verbs: ["implement", "fix", "edit", "write", "commit", "deploy", "migrate", "refactor", "patch"]
    downstream: ["ramza", "vivi", "idg"]
  ramza:
    capability_class: planner
    suggested_tier: deep
    default_for_class: planner  # Stage 3b — the default planner seat (measurement-validated:
                                # pre-registered A/B non-inferior 6/6 vs spectra 6/6, holdout-consistent,
                                # 0 MUST failures over 24 cells, 2026-07-05). Mechanized gates
                                # (right-size, rubric, EARS lint, SHA-256 freeze, drift, maker≠checker).
    fallback: spectra           # declared conservative peer for the host-tier fallthrough gate
                                # (routing.yaml is DATA; I-C2 — the kernel interprets, no eval)
    # Recall pass (routing-recall-gap): kept in lockstep with spectra below.
    trigger_verbs: ["spec", "plan", "decompose", "clarify requirements", "given/when/then", "decision-ready", "design", "requirements", "scope the work", "break down", "break this", "break the", "acceptance criteria", "draft an approach", "approach for", "scope out", "user story", "epic", "requirements for", "what should we build", "outline the work"]
    refuse_verbs: ["implement code", "modify files", "write the code"]
    downstream: ["vivi", "idg"]
  spectra:
    capability_class: planner
    suggested_tier: deep
    # conservative prose-methodology fallback; opt-in (`eidolons add spectra`);
    # named dispatch still routes to it (the +0.5 name bonus). RAMZA holds the
    # default planner seat via default_for_class above.
    trigger_verbs: ["spec", "plan", "decompose", "clarify requirements", "given/when/then", "decision-ready", "design", "requirements", "scope the work", "break down", "break this", "break the", "acceptance criteria", "draft an approach", "approach for", "scope out", "user story", "epic", "requirements for", "what should we build", "outline the work"]
    refuse_verbs: ["implement code", "modify files", "write the code"]
    downstream: ["apivr", "idg"]
  vivi:
    capability_class: coder
    suggested_tier: standard
    loop_native: true         # drives `eidolons sandbox loop`; host-adaptive shape
                              # (iterate on thinking hosts / fanout on standard hosts)
    default_for_class: coder  # Stage 3b — the default coder seat (measurement-validated:
                              # fanout pass^2 1.00 vs APIVR-Δ 0.67, weak-host adversarial suite)
    degraded_mode: fanout     # loop-shape on weak/undeclared hosts (replaces the
                              # prose-only "degrade to APIVR-Δ")
    fallback: apivr           # declared conservative peer for the S1.7 host-tier
                              # fallthrough gate (routing.yaml is DATA; I-C2)
    # Recall pass (routing-recall-gap): the mutation verbs an engineer actually
    # types ("refactor", "optimize", "port", "clean up", "write a test") were
    # all absent. Kept in lockstep with apivr below — the declared fallback peer
    # must not have a different reachable surface than the default seat.
    trigger_verbs: ["implement", "build", "fix", "extend", "wire up", "make tests pass", "add a", "add the", "patch", "code", "refactor", "optimize", "port the", "migrate", "clean up", "write a test", "add tests", "rewrite", "update the", "modify", "hook up", "add retry", "add support"]
    refuse_verbs: ["design from scratch", "novel architecture", "greenfield"]
    downstream: ["idg"]
  apivr:
    capability_class: coder
    suggested_tier: standard
    loop_native: false        # conservative non-loop fallback; opt-in (`eidolons add apivr`);
                              # named dispatch still routes to it (the +0.5 name bonus)
    trigger_verbs: ["implement", "build", "fix", "extend", "wire up", "make tests pass", "add a", "add the", "patch", "code", "refactor", "optimize", "port the", "migrate", "clean up", "write a test", "add tests", "rewrite", "update the", "modify", "hook up", "add retry", "add support"]
    refuse_verbs: ["design from scratch", "novel architecture", "greenfield"]
    downstream: ["idg"]
  idg:
    capability_class: scriber
    suggested_tier: light
    # Recall pass (routing-recall-gap): natural scribe phrasings ("write up",
    # "summarize", "release notes") were absent.
    trigger_verbs: ["document", "adr", "runbook", "chronicle", "synthesize", "record decisions", "write the docs", "changelog narrative", "write up", "summarize", "capture this", "changelog entry", "release notes", "for new contributors", "hand-off note", "write the readme", "explain to"]
    refuse_verbs: ["explore repo", "find calls", "retrieve", "analyze code"]
    downstream: []
  forge:
    capability_class: reasoner
    suggested_tier: deep
    degraded_mode: sample-select  # N-sample deliberation + rubric-agreement selection
                                   # on weak hosts (sampling replaces unreliable
                                   # single-trace self-correction)
    # Recall pass (routing-recall-gap): "compare", "evaluate", "pros and cons"
    # and "weigh" are the everyday words for a deliberation request.
    trigger_verbs: ["trade-off", "tradeoff", "which approach", "should we", "ambiguous", "counterfactual", "deliberate", "x or y", "decide between", "compare", "evaluate", "pros and cons", "weigh", "is it better", "options for", "or should", "versus", "alternatives", "worth it"]
    refuse_verbs: ["implement", "retrieve", "synthesize prose"]
    downstream: []
  vigil:
    capability_class: debugger
    suggested_tier: deep
    # Recall pass (routing-recall-gap): "diagnose" and "debug" — the two most
    # common words for this capability class — were both absent, as was every
    # natural failure-report phrasing ("stopped working", "passes locally but
    # fails in CI"). Failure CONTEXT is the discriminator against the coder:
    # when both fire, the forensic-then-fix chain is the correct outcome.
    trigger_verbs: ["root cause", "flaky", "heisenbug", "regression after", "post-mortem", "postmortem", "why does this fail", "why does it fail", "diagnose", "debug", "why does", "why is", "why did", "broken", "stopped working", "no longer works", "fails in ci", "passes locally", "track down", "something is wrong", "intermittent", "hangs", "times out", "broke after", "what is causing", "what's causing", "keeps failing", "figure out why", "stopped firing"]
    refuse_verbs: ["build new feature", "plan from scratch"]
    downstream: []
  kupo:
    capability_class: executor
    suggested_tier: light
    # NARROW by design: only clearly-localized micro-task verbs, so the router never
    # poaches APIVR-Δ/Vivi coding work. Kupo is orchestrator-dispatched (subagents cannot
    # spawn subagents); the localized_micro_task signal boosts Kupo over the coder when
    # a fix-family verb co-occurs with a localized-task marker (+0.15 → 0.95 > 0.8).
    escalation:                # verifier-failed micro-task escalates once to the coder;
      on_fail: reroute         # the kernel only SURFACES this data in the artifact —
      reroute_to: vivi         # execution belongs to the orchestrator/sandbox.
      max_escalations: 1
    # Recall pass (routing-recall-gap): additions stay DELIBERATELY narrow —
    # each new phrase names a single localized edit, so the executor still
    # cannot poach the coder's work (the NARROW-by-design note above holds).
    trigger_verbs: ["rename symbol", "import fix", "fix the import", "path fix", "bump lockfile", "pin dependency", "pin the version", "autofix lint", "format fix", "one-line fix", "single-line edit", "update fixture", "update snapshot", "grep-replace", "search-replace", "config key edit", "fix the typo", "fix the path", "change the version", "bump the version", "version string", "swap the", "correct the spelling", "point the import", "rename the"]
    refuse_verbs: ["design", "cross-cutting refactor", "refactor across", "plan", "novel architecture", "greenfield", "open-ended", "loop-native campaign", "implement feature"]
    downstream: []
  gilgamesh:
    capability_class: generalist
    suggested_tier: standard
    # ESL change generalist-eidolon (R-004/R-005/R-019): NO positive
    # trigger_verbs by design — a fallthrough-only worker that MUST never
    # enter Step-1 classification or outrank a specialist scoring >= tau.
    # It is dispatched solely via Dispatch Protocol Step-2(a) (S6=no
    # specialist >= tau, S7=no chain, then the presence-based S1..S5
    # predicate over closed lexicons — methodology/cortex/dispatch-predicate.md).
    # Even a NAMED mention ("Gilgamesh, ...") only earns the +0.5 name bonus
    # on a raw=0 base (score 0.5 < tau_standard 0.6), so it still cannot
    # win Step-1 through this kernel — a second, independent guarantee of
    # R-019 beyond the empty trigger_verbs array.
    trigger_verbs: []
    # refuse_verbs tile the specialist space (one representative phrase per
    # routed capability class) + deploy/migrate (irreversible-without-checker,
    # R-009 sandbox-first/PROPOSE-only) + routing/spawning (HC8 — worker,
    # never router) + underspecified/ambiguous scope (R-020 — still clarify).
    refuse_verbs: ["design", "design from scratch", "novel architecture", "spec", "plan", "decompose", "map the codebase", "trace calls", "audit read-only", "document", "runbook", "chronicle", "trade-off", "which approach", "deliberate", "root cause", "flaky", "heisenbug", "rename symbol", "lockfile bump", "deploy", "migrate", "route to another eidolon", "spawn subagents", "underspecified", "ambiguous scope"]
    downstream: []

# ─── Confidence signals (Dispatch Protocol §"Confidence Signals") ───────────────
# Applied additively to the matched Eidolon's score. `stakes: true` marks a
# signal as a TRANCE stakes-flag contributor (does not by itself escalate tier).
# Boosts are in score-space (added to base; final compared uncapped, displayed
# capped at 1.0). stack_trace / prior_apivr_failure are DECISIVE (≥ tau_standard
# alone and dominate a competing 'fix' verb) to honour V9/V5, which the cortex
# prose under-weights at +0.3.
signals:
  - id: stack_trace
    match: ["stack trace", "traceback", "panic", "segfault", "still failing", "after retry", "fails after"]
    boost: { vigil: 0.9 }
    note: "stack trace / repeat failure → VIGIL fast-path (V9)"
  - id: prior_apivr_failure
    match: ["tried to fix", "already tried", "reflect exhausted", "still broken after"]
    boost: { vigil: 0.95 }
    note: "prior failed APIVR-Δ attempt → VIGIL (V5)"
  - id: greenfield
    match: ["greenfield", "from scratch", "brand new project", "novel architecture"]
    boost: { vivi: -0.4, apivr: -0.4 }
    note: "the coder class refuses greenfield (Vivi and APIVR-Δ alike)"
  - id: no_spec_yet
    match: ["don't have a spec", "no spec yet", "i don't know the call graph", "not sure what to build"]
    boost: { ramza: 0.2 }
  - id: large_surface
    match: ["entire monorepo", "whole codebase", "all modules", "across all"]
    boost: { atlas: 0.2 }
    stakes: true
    note: "large surface → ATLAS-TRANCE candidate (V2)"
  - id: unbounded_scope
    # Widening the coder lexicon (routing-recall-gap) made bare "refactor" /
    # "migrate" / "rewrite" reach Vivi on their own — correct for a scoped ask
    # ("refactor the roster loader"), WRONG when the same verb carries no
    # boundary ("refactor across the entire codebase"). An unbounded mutation
    # is precisely the case the Step-2 predicate already treats as
    # underspecified via its S5 bounded-scope signal; this mirrors that
    # judgement into Step 1 instead of letting a single verb match hand a
    # whole-repo rewrite to a coder. -0.4 drops a lone verb match (0.8) to 0.4,
    # below tau_standard 0.6 → clarify, while a 2+ phrase match (0.9 / 0.97)
    # survives at 0.65 / 0.72 and still routes. The penalty was -0.4 in the
    # first revision, which vetoed EVERY coder score including raw=3 (0.97 →
    # 0.57) — an unconditional veto, not the "bare verb match" the note claimed.
    # Named dispatch still wins: the +0.5 name bonus clears the penalty.
    #
    # HONEST LIMIT — this is NOT a full mirror of the Step-2 predicate's S5.
    # S5 (methodology/cortex/dispatch-predicate.md §"Reference extractor") has a
    # LIMITER RESCUE: a generic scope is forgiven when a limiter ("only",
    # "just") AND a path token co-occur. The signal table is presence-matched
    # and cannot express that conjunction, so Step 1 implements only the
    # punitive half. Consequence, stated rather than hidden: a genuinely bounded
    # ask that happens to contain one of these phrases ("update the helper at
    # all call sites in cli/src/lib.sh only") still falls to `clarify`. That is
    # a CONSERVATIVE failure — it asks instead of mis-routing — and since the
    # harness hook now surfaces the clarification on a work-intent prompt, it is
    # visible rather than silent. Implementing the rescue needs conditional
    # signals, which is a kernel change, not a data change.
    # SPLIT into two tiers (round 2). A single tier could not be right for both
    # "refactor across the entire codebase" (genuinely repo-wide) and "rename
    # the symbol at all call sites in cli/src/run.sh" (one named file). At -0.4
    # the second was suppressed; at -0.25 `localized_micro_task`'s +0.15
    # cancelled most of it and repo-wide renames went BACK to the ≤2-file
    # executor at 0.70 — measured 5/7 by a checker. Tiering fixes the class.
    # Known to be a closed list with a tail — a checker measured 8/10 unbounded
    # mutations escaping the round-2 list via `across the codebase` /
    # `throughout the repo` / `globally` / `all files` / `codebase-wide`. Those
    # are added; the invariant is stated as "measured", not "never", because a
    # phrase list cannot honestly claim exhaustiveness.
    match: ["entire codebase", "whole codebase", "across the entire", "across the whole", "across the codebase", "across all", "throughout the repo", "throughout the codebase", "everywhere", "everywhere it appears", "project-wide", "projectwide", "repo-wide", "repowide", "codebase-wide", "globally", "in all files", "in all the", "all files", "all modules", "all packages"]
    boost: { vivi: -0.4, apivr: -0.4, kupo: -0.4 }
    note: "REPO-WIDE mutation scope → never auto-route to a coder/executor; no rescue (mirrors predicate S5 with no LIMITER present)"
  - id: unbounded_scope_qualified
    # The rescuable tier: a generic quantifier that a PATH can bound. This is
    # the limiter/path rescue predicate S5 has had all along and Step 1 lacked —
    # the earlier note admitted the gap; `skip_if_path` closes it instead.
    #   "rename the symbol at all call sites in cli/src/run.sh"  -> path -> route
    #   "point the import at the new module path in every file"  -> none -> clarify
    skip_if_path: true
    match: ["all call sites", "every file", "all the call sites", "in every module"]
    boost: { vivi: -0.4, apivr: -0.4, kupo: -0.4 }
    note: "generic quantifier with NO path to bound it → treat as unbounded; a path token rescues it (predicate S5 limiter/path rule)"
  - id: read_only_question
    # Precision guard (found by the checker on `routing-recall-gap`): widening
    # the coder/scriber lexicons made bare words match inside INTERROGATIVES.
    # "which port does the server listen on?" scored vivi 0.8 and the hook then
    # instructed the host to "Delegate to vivi now. Do NOT implement ... " —
    # a question answered by an edit. Measured over 24 read-only interrogatives,
    # writer-routing went 3/24 -> 15/24 before this signal.
    # Only WRITE-capable classes + the scriber are penalised: a question is
    # still allowed to reach ATLAS (read-only), FORGE (deliberation), VIGIL
    # (a failure question) and RAMZA (a requirements question). -0.5 drops a
    # lone match (0.8) to 0.3, well under tau.
    # GATED ON INTERROGATIVE FORM (round 2). Presence-matching alone was wrong:
    # "is the" / "which" / "what happens" occur constantly inside SUBORDINATE
    # clauses of ordinary imperatives — "fix the bug where the retry count is
    # the wrong type" — and the -0.5 vetoed even a raw=2 coder score. Two
    # independent checkers measured 18/18 and 12/12 work requests regressing
    # from a correct dispatch to `clarify`, invisible to a green suite.
    # `requires_question_form` makes the kernel apply this ONLY when the prompt
    # is actually a question (ends in '?' or opens with an interrogative), which
    # is also why the match list no longer needs to enumerate every opener —
    # `did` / `have we` / `were` / `am I` / `isn't` / `how do I` are all covered
    # by form, and were the "new class" the first fix missed.
    # NOTE: "should we ..." is deliberately NOT matched — penalising the coder
    # there would make the decide-then-implement chain unreachable.
    # With the form gate doing the real work, the match list is deliberately
    # GENERIC — ubiquitous function words, so it fires on essentially any
    # English question. Enumerating openers here was what let `did` / `have we`
    # / `am I` / `isn't` slip through as a "new class"; a closed phrase list can
    # always be walked around, whereas interrogative form cannot.
    # The form gate decides WHETHER this applies; the list below only has to be
    # present. An earlier note called it "essentially any English question" —
    # untrue, and a checker found the counterexample (`what is our current code
    # coverage?` contains none of the round-2 words and escaped to vivi). The
    # list now carries the closed-class words that are hard to avoid in an
    # English question; it is still a list, so the invariant says "measured".
    requires_question_form: true
    match: ["the", "a", "an", "we", "i", "it", "this", "that", "there", "any", "anything", "our", "your", "their", "my", "you", "they", "us", "them", "everyone", "anyone", "users", "teams", "do", "does", "did", "is", "are", "was", "were", "still", "ever", "currently", "current"]
    boost: { vivi: -0.5, apivr: -0.5, kupo: -0.5, idg: -0.5 }
    note: "read-only interrogative → never hand a question to a writer on a bare verb match"
  - id: localized_micro_task
    # Kupo-vs-coder tiebreak (executor precedence). The `fix`-family verbs
    # (fix the import / one-line fix / fix the typo) tie Kupo with Vivi/APIVR-Δ
    # at 0.8 because the coder matches the bare word `fix`. When a LOCALIZED
    # micro-task marker co-occurs, prefer the executor: boost Kupo by +0.15
    # (0.8 -> 0.95, clears the coder's 0.8) while staying below the +0.5
    # name bonus, so "Vivi, fix the import" still routes to Vivi.
    # Pure DATA (I-C2): the kernel sums this boost; there is no eval.
    match: ["import", "lockfile", "lint autofix", "typo", "rename", "one-line", "single-line", "fixture", "snapshot", "dependency pin", "pin the version", "grep-replace", "search-replace", "path fix", "config key"]
    boost: { kupo: 0.15 }
    note: "localized micro-task marker → prefer the executor over the coder (Kupo-vs-Vivi tiebreak)"

# ─── Chain templates (EIDOLONS.md §"Chain Templates") ───────────────────────────
# Selected when ≥2 capability classes co-trigger. `requires_classes` lists the
# capability classes whose presence selects this template; the kernel picks the
# most specific (longest requires_classes) matching template.
#
# TIE-BREAK NOTE (chain-three-class): the kernel does `sort_by(-spec) | .[0]`,
# and jq's sort is STABLE — so two templates of equal specificity that both
# match are resolved by nothing more principled than which one is declared
# first in this file. That is not a rule anyone chose; it is an artifact.
#
# This list is NOT globally closed under union: **4** equal-specificity pairs
# among the pre-existing 2-class templates have no more-specific entry covering
# their union, and are still decided by file order (e.g. decide-then-implement
# vs ship-fast on a reasoner+planner+coder prompt). Those predate this change
# and are left alone deliberately — resolving them means choosing semantics for
# each, not adding a mechanism.
#
# A pair (A,B) counts as RESOLVED iff some template C has
# `C.requires_classes ⊆ (A ∪ B)` AND `|C| > |A|` — SUBSET, matching what the
# kernel actually does (`select(requires_classes ⊆ classes) | sort_by(-spec)`).
# An earlier revision tested set-EQUALITY with the union, which over-reported
# ties (it claimed 7) and was blind to a duplicate class set entirely. Because
# the expected list had been generated with that same wrong expression, both
# sides of the test agreed and the gate passed while proving nothing.
#
# What IS guaranteed: adding `diagnose-then-plan-then-fix` would itself have
# created a 6th such pair (against plan-before-build, on a
# scout+debugger+planner+coder prompt), so `scout-diagnose-plan-fix` is added
# alongside it to cover that union and keep specificity decisive. The three-class
# entry ALSO resolves a pre-existing tie (ship-fast vs forensic-then-fix at
# coder+debugger+planner), so the set moved 6 → 5. `scout-diagnose-fix` then
# resolved a second one (audit-without-touching vs forensic-then-fix at
# coder+debugger+scout+scriber), moving it 5 → 4.
# `cli/tests/routing_chains.bats` PINS the unresolved set to exactly those 4 —
# a new template that introduces a 5th ambiguity, INCLUDING one that merely
# duplicates an existing class set, fails the suite.
chains:
  - name: scout-diagnose-plan-fix
    steps: ["atlas", "vigil", "ramza", "vivi", "idg"]
    requires_classes: ["scout", "debugger", "planner", "coder"]
    when: "Unfamiliar code + a live failure + a build (widest pipeline)"
    # Exists so specificity stays decisive: without it, plan-before-build and
    # diagnose-then-plan-then-fix both match a scout+debugger+planner+coder
    # prompt at specificity 3 and file order silently picks the winner.
    # Ends with `idg` for the same reason plan-before-build does — this is the
    # WIDEST pipeline, and the entry it supersedes carried a trailing scriber
    # step. Without it, a prompt that explicitly asked for documentation lost
    # the docs step: exactly the silent step-drop this whole change removes.
  - name: plan-before-build
    steps: ["atlas", "ramza", "vivi", "idg"]
    requires_classes: ["scout", "planner", "coder"]
    when: "Unfamiliar code + multi-component change"
  - name: scout-diagnose-decide-plan-fix
    steps: ["atlas", "vigil", "forge", "ramza", "vivi", "idg"]
    requires_classes: ["scout", "debugger", "reasoner", "planner", "coder"]
    when: "Every routed class present — the full pipeline"
    # Covers the union of the two spec-4 templates below, so adding
    # scout-diagnose-decide-fix does not make them tie.
  - name: scout-diagnose-decide-fix
    steps: ["atlas", "vigil", "forge", "vivi", "idg"]
    requires_classes: ["scout", "debugger", "reasoner", "coder"]
    when: "Unfamiliar code + a live failure + a decision + a fix"
    # Added after a checker measured scout-diagnose-fix taking this combination
    # over from decide-then-implement and DROPPING the reasoner: on
    # "audit the module, root cause the failure, decide between rollback or
    # patch, then implement it", forge scored 0.8 and idg scored 0.0 — the
    # template hardcoded the class that scored ZERO and excluded the one that
    # scored 0.8. A user who asked to decide between two fixes got no
    # deliberation step. Diagnosis precedes deliberation for the same reason
    # diagnose-then-plan-then-fix orders it that way: root-cause first, then
    # choose.
  - name: scout-diagnose-fix
    steps: ["atlas", "vigil", "vivi", "idg"]
    requires_classes: ["scout", "debugger", "coder"]
    when: "Unfamiliar code + a live failure + a fix, with no spec needed"
    # Closes the last residual recorded by `chain-three-class`. Before this,
    # scout+debugger+coder fell back to the 2-class forensic-then-fix and
    # dropped the SCOUT step. Worse, adding a scriber turned it into one of the
    # five order-dependent ties and `audit-without-touching` won by declaration
    # order — so "audit the module, diagnose the failure, fix it and document
    # it" returned [atlas, idg], dropping BOTH the diagnosis and the fix and
    # handing back a read-only scout for a prompt that asked for a repair.
    #
    # Ends with `idg` for the same reason plan-before-build and
    # scout-diagnose-plan-fix do: it supersedes an entry that carried a
    # trailing scriber step, and a 3-class scout pipeline that silently lost it
    # would be the step-drop this family of changes exists to remove.
    #
    # Adds NO new ambiguity: its unions with the other two spec-3 templates are
    # both {scout,debugger,planner,coder}, already covered by
    # scout-diagnose-plan-fix at spec 4. It also RESOLVES a pre-existing tie
    # (audit-without-touching vs forensic-then-fix), moving the set 5 -> 4.
  - name: diagnose-then-plan-then-fix
    steps: ["vigil", "ramza", "vivi"]
    requires_classes: ["debugger", "planner", "coder"]
    when: "A live failure that needs a spec before the patch"
    # Without this, a diagnose+plan+fix prompt fell back to the 2-class
    # `ship-fast` and the DIAGNOSIS STEP WAS SILENTLY DROPPED — the router
    # handed a planner a failure nobody had root-caused yet.
  - name: decide-then-implement
    steps: ["forge", "ramza", "vivi"]
    requires_classes: ["reasoner", "coder"]
    when: "Should we use X or Y, then build it"
  - name: audit-without-touching
    steps: ["atlas", "idg"]
    requires_classes: ["scout", "scriber"]
    when: "Audit/explain/review with no write intent"
  - name: ship-fast
    steps: ["ramza", "vivi"]
    requires_classes: ["planner", "coder"]
    when: "Known terrain, scoped feature"
  - name: forensic-then-fix
    steps: ["vigil", "vivi"]
    requires_classes: ["debugger", "coder"]
    when: "Bug with reproduction + verified patch"
  - name: scout-then-spec
    steps: ["atlas", "ramza"]
    requires_classes: ["scout", "planner"]
    when: "Discovery + spec verbs co-occur (V3)"
