# roster/model-profiles.yaml
# SOLE home for vendor model strings (prime-directive #162).
# Do NOT put model strings in routing.yaml, index.yaml, EIDOLONS.md, or any
# cortex file. Adding a new profile is a pure data change — zero code change.
#
# Schema: ../schemas/model-profiles.schema.json
# Consumer override surface: eidolons.yaml `models:` block
#   models.profile      → switch active profile
#   models.calibration  → per-tier override within the active profile
#   models.members.<id>.model → PIN (ignores tier/profile entirely)
schema_version: 1
default_profile: anthropic

profiles:
  anthropic:
    description: "Anthropic Claude family"
    applies_to_hosts: [claude-code]
    tiers:
      light:    haiku
      standard: sonnet
      deep:     opus
  openai:
    description: "OpenAI GPT-5.6 Codex capability tiers"
    applies_to_hosts: [codex]
    tiers:
      light:    gpt-5.6-luna
      standard: gpt-5.6-terra
      deep:     gpt-5.6-sol
    reasoning_effort:
      light:    low
      standard: medium
      deep:     medium
  cursor:
    description: "Cursor subagent model tier mapping (cross-vendor, checked against Cursor model catalog 2026-09-28)"
    applies_to_hosts: [cursor]
    tiers:
      light:    gemini-3.8-flash
      standard: composer-2.5
      deep:     claude-fable-5-1
  # Opt-in. Keep this after `cursor`: when `models` is absent, Cursor auto-selects
  # the first profile whose applies_to_hosts includes `cursor`.
  cursor-native:
    description: "Cursor first-party models only (Composer + Grok); stays on the Cursor Models usage pool"
    applies_to_hosts: [cursor]
    tiers:
      light:    composer-2.5[]
      standard: grok-4.5
      deep:     grok-4.6
