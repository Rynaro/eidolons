schema: eidolons/change-spec.v1
change_id: crystalium-residual-eight-plan
tier: full
maker: ramza
checker: kupo
target: crystalium — the residual eight open issues (#42 #44 #45 #47 #48 #52 #55 #57), shipped as v2.0.2 (gates + entrypoint) and v2.1.0 (recall order and membership)

problem: >
  After #36 (v1.9.0) and #38 (v1.10.0) shipped, eight issues remained open against
  crystalium, and they were not eight independent defects. Three were REAL production
  defects in recall (#45 cross-layer rank blocking — per-layer append order dominates the
  fused ranking; #44 the sparse candidate set is status-blind, so deprecated rows consume
  budget that active rows never get; #42 seeds are structurally excluded from both derived
  arms, so a seed can never be credited by its own neighbourhood). The other five were
  claims about GATES rather than about the product: #52's `cross_layer` axis could not fail
  because it measured `bm25_search` directly rather than the fused ranking; #48's AC-138/139
  were unfalsifiable on the shipped fusion-gate fixture; #47 and #55 asserted properties
  (corpus scaling belongs to `candidate_k`; a fusion-weight-discriminating band) that no
  shipped gate discriminated; #57 had no test exercising `run_stdio`/`run_http` at all — a
  server that cannot start would have passed the entire suite. The unifying failure is the
  campaign's own recurring species: a gate that cannot fail on the defect it names. Fixing
  the three real defects without first making the gates falsifiable would have produced
  green evidence that proved nothing.

decision: >
  H-B (gate-first two-phase shared rig) was selected over four alternatives at the explore
  gate (84 vs 74/55.5/44/38.5). Phase 1 (v2.0.2) builds the shared corpus rig and lands the
  five gate/entrypoint units in parallel on independent worktrees, so that every gate is
  falsifiable BEFORE any behavioural fix is measured against it. Phase 2 (v2.1.0) lands the
  three real recall defects strictly serially on `retrieve.py` (W-45 -> W-44 -> W-42),
  because they touch overlapping code and a parallel merge would make attribution
  impossible. Every unit carries maker red-evidence (a perturbation that reddens the gate
  plus a restore that returns it to green), and an identity-distinct checker re-breaks the
  batch on axes the maker never used. Two issues close as dispositions rather than fixes:
  #47 WONTFIX-with-rationale plus a gate, and #55's band formally unsupported. #48 closes
  as a FORGE-ruled SPLIT — AC-138/139 RETIRED against the shipped fixture (the mechanism
  they measured was deleted by #41), AC-322 DISCHARGED on a purpose-built distinct-phantom
  fixture.

safety_invariant: >
  No behavioural change may ride in on a gate-only release. AC-331 pins
  `mcp-server/src/` to an EMPTY diff for the whole of Phase 1 — the v2.0.2 batch is tests,
  eval rig and documentation only. Phase 2's three fixes are each individually revertible
  and each gated by a criterion that was proven falsifiable in Phase 1. The default for
  #42's new capability is OFF (`recall_seed_derived_credit = False`, FORGE ruling), so
  v2.1.0 changes no recall result unless a caller opts in.

invariants:
  - Every criterion must be executed against BOTH a passing and a failing input before it
    is trusted. A criterion is not sound because it was carefully written.
  - Maker != checker on every gate; the checker must re-break on an axis the maker's own
    red-evidence never touched, proven by patch-diff against `red-evidence-*.json`.
  - Global rule (g) artifact-freshness — every jq criterion reads a producer-named artifact
    stamped with a per-measurement nonce, never stdout (K-B15 stdout contamination).
  - Global rule (f) positive-capability-before-routing-negative — a criterion asserting a
    thing does NOT happen must be paired with a control proving the mechanism can happen.
  - Any criterion that greps SOURCE PROSE must normalise comment line-wrapping first
    (promoted from AC-381's broken fence anchor; every fence comment in this codebase wraps).
  - AC-382 runs as step 0 of BOTH release checklists, before any other criterion executes.

known_gaps:
  - "#44 censoring-signal coverage: no criterion connects #44's own censoring-signal
    recompute to an observable outcome on any of its 3 widen sites. AC-377 is the only
    criterion checking the post-widen signal and its fixture runs with
    `recall_active_only=False`, so it never exercises #44's widen at all. Found by the
    v2.1.0 checker while red-checking; reported as a negative result before it pivoted to
    an axis that does flip a gate. Tracked as crystalium#63."
  - "`compare_wire.py` stamps a sentinel over excluded keys regardless of value, and its
    presence guard tests `\"version\" not in si`, which a `null` satisfies — so a null
    version or null commit id reports WIRE IDENTICAL. Proven live by poisoning a capture.
    The v2.1.0 verification used a shape-guard-first wrapper; the guard was never landed
    into the comparator itself. Tracked as crystalium#64."
  - "The archived golden wire capture is `golden-wire-v1.11.0.json`, which predates the
    v2.0.0 tool-rename and isError changes. AC-361 initially FAILED against it with 11
    differences that were all deliberate, shipped, CHANGELOG-documented v2.0.0 behaviour.
    Re-baselining to v2.0.2 was ruled non-blocking for this tag. Tracked as crystalium#65."
  - "CI's other three jobs (conformance suite, JSON schema validation, install.sh
    idempotency) were not reproduced locally during the v2.1.0 runner-minutes outage. They
    ran green post-merge on `main` — CLOSED, see verification.post_merge_ci."
  - "D8's checker perturbation table contained 3 replay rows (G-XL, G-WD, G-FLOOR) that
    were same-mechanism replays of red-checks the makers had already executed. D8 was
    itself the fix for a defective perturbation table (K-B9). The checker avoided it only
    by verifying each axis empirically before committing."

