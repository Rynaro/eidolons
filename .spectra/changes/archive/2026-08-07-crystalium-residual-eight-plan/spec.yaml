test_harness: >
  Shared corpus rig (W-RIG, 36 tests) with a verdict classifier that returns NO NUMBERS on
  a confounded axis, plus per-unit gates. Suite is run in two modes because they are not
  the same measurement: `make test` (docker compose, bind mount `.:/app` shadowing the
  image) and `make test-ci` (also compose). CI itself runs `docker run` against the BAKED
  image with a different PYTHONPATH — a bind-mounted run cannot detect a packaging or
  baked-source defect, so CI's literal invocation was reproduced separately and the baked
  source ASSERTED (version, `_FALLBACK_VERSION`, the `recall_seed_derived_credit` default
  and the presence of `sparse_topup`) before any green was accepted.

