  precondition: AC-141 (reverted build, floor=1, k=1, target NOT first) must be green first
  predicted_mechanism: D4 reseeding, not the weighting — pre-registered so it can be wrong
  if_red: a finding about the change's nature; routes to DP-1, does not auto-flip the flag (DP-4(ii))

