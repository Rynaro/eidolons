problem_summary: >
  rrf_merge_scored fuses arms UNWEIGHTED, so a record seen by many weak arms outranks one
  ranked first by the single arm that fits the query (P1). The extra arms are not independent
  evidence: graph and completion are both seeded from dense_ranking, so the dense arm votes
  three times (P2). And neither derived arm has a deterministic rank order at all —
  neighbor_expand returns a set and decaying_walk scores a set comprehension, so every graph
  and completion rank varies with PYTHONHASHSEED (P3), which also explains issue #36's
  unreproducible F-V6 BENCH-NOTES figure. v1.9.0's FETCH_WIDTH_FLOOR is a guard on P1's
  symptom at small k, not a cure; FORGE's own DP-R1 ruling said so and ordered this follow-up.

design:
  D1: weighted_rrf_merge_scored — new pure function; rrf_merge/rrf_merge_scored untouched
  D2: graph + completion collapsed into ONE derived voter by min-rank (correlation correction)
  D3: query-conditional sparse weight from search-space-local selectivity; numerator and
      denominator MUST be drawn from the same population (layer axis AND status axis)
  D4: graph/completion seeded from a base-arm (sparse+dense) preliminary fusion, not dense alone
  D5: deterministic arm ordering (two consumer-side sorts; no storage API change)
  D6: "four config fields"
  D7: "subsumption under recall_relevance_primary"
  D8: "explain.fusion diagnostic (n_scoped + n_scoped_status)"

stories: [S-1 determinism, S-2 pure fusion, S-3 weight resolution, S-4 wiring, S-5 config, S-6 diagnosability, S-7 eval gates]
land_first: S-1
