schema: eidolons/change-spec.v1
change_id: crystalium-rrf-fusion-38
tier: full
maker: vivi
checker: vigil
target: crystalium — weighted RRF fusion + base-arm seeding + arm-order determinism (fix Rynaro/crystalium#38, ships v1.10.0)

problem: >
  `Aetheryte.recall()` fuses up to four ranked lists with `rrf_merge_scored`
  (`retrieve.py:61-88`), which sums `1/(60+rank)` across arms with no per-arm weight. A
  record's fused score therefore grows with the *number* of arms that mention it,
  regardless of how well any single arm fits the query (P1). The extra arms are not
  independent evidence: `seed_ids = dense_ranking[:fetch_width]` (`:377`) seeds graph
  expansion and `completion_seeds = seed_ids or sparse_ranking[:fetch_width]` (`:397`)
  seeds the completion walk from the same set, so the dense arm votes once directly and
  twice more through its own neighbourhood while the sparse arm seeds nothing (P2). And
  neither derived arm has a deterministic rank order at all: `neighbor_expand` returns
  `set[str]` (`graph.py:205,221,256`) which `retrieve.py:383` iterates directly, and
  `decaying_walk` scores a set comprehension (`graph.py:279-284`) which `:405` sorts by
  score only, so every graph and completion rank — and every fused score and surfaced
  `CrystalSummary.score` touching them — varies with `PYTHONHASHSEED` (P3). P3 also
  explains #36's F-V6 unreproducible BENCH-NOTES figure, which had no mechanism on record.
  Measured on the shipped retrieval-gate fixture at `ef42967`: `spoke1`, which matches the
  query on no lexical token at all, outranks the exact lexical match at fused rank 0 —
  P1 inverting a real corpus, not a constructed one. v1.9.0's `FETCH_WIDTH_FLOOR = 10`
  guards P1's symptom at small `k` without touching the fusion; FORGE's own DP-R1 ruling
  said so and ordered this follow-up.

decision:
  selected: weighted RRF with a correlated-family merge (D2) + query-conditional sparse boost (D3) + base-arm seeding (D4) + consumer-side arm-order determinism (D5)
  scores: { H-B: 81.5, H-A: 72.5, H-D: 65.5, H-E: 60.5, H-C: 59.0 }  # planner explore scores, rev 1.1.0 — SUPERSEDED BY MEASUREMENT: H-A was re-scored 61.5 -> 72.5 when a modelling error was found, then measured-REFUTED outright (measurement.md: gate_pass=false at 6/6 hash seeds); FORGE ratified H-B on the measurement, not on these scores
  rejected:
    - >-
      H-A static per-arm down-weighting (72.5 after re-score, the closest rival):
      rejected on MEASUREMENT — at `w_graph=0.35 / w_comp=0.25` the shipped retrieval
      gate collapses `multihop_f1.completion` 0.4615 -> 0.3077 with `gate_pass=false`,
      unanimous at 6/6 `PYTHONHASHSEED` values. Mechanism measured: `spoke2`'s only vote
      is the completion arm, so down-weighting that arm alone evicts it from the top-10
      (`0.25/62 = 0.004032`). Anomaly B adds an independent structural argument — records
      at or above seed rank are barred from both derived arms, so H-A cannot demote the
      record class the issue names. Both the planner's model and the checker's
      counter-model were wrong about the dense column; the true one is mixed
      (`spoke1 = 17`, `spoke2 = ABSENT`).
    - >-
      `fusion_weight_derived = 0.95` (DP-2's documented-band candidate): rejected —
      measured FLAKY, not merely worse. `spoke2`'s sole vote is `w_d/(60+r)` where `r` is
      the hash-nondeterministic completion rank; 0.95 passes 6/7 seeds and goes RED at
      `PYTHONHASHSEED=5`, 0.90 fails deterministically, 1.00 passes 7/7. Values below 1.0
      remain legal config but leave the documented band, and no test, doc or CHANGELOG
      line may present 0.95 as a "precision dial". Any value below 1.0 also forfeits the
      D2 identity property; any value above 1.0 re-creates P1.
    - >-
      all-statuses selectivity denominator (DP-9 option (a), the checker's original
      prescription): rejected — FORGE ruled (b), active-only on both ends tracking
      `recall_active_only`, on the planner's aging argument: under P0-5 the deprecated
      rows are lexical near-duplicates of the target itself, so all-statuses lets records
      the caller never sees dilute the very signal they duplicate. (a) additionally
      carries a second decay path — `bm25_search` applies `LIMIT candidate_k` with no
      status predicate, so deprecated rows consume fetch slots, can trip the censoring
      branch to `w_sparse = 1.0`, and can crowd active hits out of the candidate set
      entirely (opened as F-D).
    - >-
      consumer-side per-seed union in `retrieve.py` as a workaround for anomaly A:
      rejected BY NAME by FORGE (DP-8). Anomaly A is a store-layer defect
      (`graph.py:205-256` wraps the whole seed loop in one `try`, so Kuzu's
      cursor-exhaustion raise aborts expansion after the first seed); patching around it
      in the consumer would mask a high-severity store bug behind a caller-side loop and
      make F-A harder to see. D5's two consumer-side sorts ship; `storage/graph.py` is a
      hard scope fence, verified empty-diff.
    - >-
      corpus-scaled `FETCH_WIDTH_FLOOR` (DP-6 option (a)): rejected — the floor is a
      stability device, and scaling it with corpus size makes the ranking universe a
      function of unrelated commits, destroying reproducibility for the deterministic
      eval gates this change depends on. The measurement named the real target instead:
      `dense_ranking` held exactly 30 of 31 crystals and it is `candidate_k`, not the
      seed-width floor, that cut `spoke2` out of the dense arm. Opened as D-4.
    - >-
      tie-break-neutral fusion-gate fixture (would have converted AC-138/AC-139 from
      INDETERMINATE to green): DECLINED by the maker and ratified by the checker. Measured
      cost: AC-125's unanimity 7/7 -> ~2/7. AC-125 is one of AC-136's frozen six, so a red
      AC-125 flips `recall_weighted_fusion` to `False` mechanically — i.e. it would ship
      unweighted fusion with the measured P1 inversion live, in exchange for greening two
      criteria that are explicitly permitted to be indeterminate. The diagnostic variant
      was measured across 14 seeds and preserved as knowledge, not shipped as fixture.
  safety_default: >-
    `Config.recall_weighted_fusion` defaults `true`, subsumed by
    `recall_relevance_primary` (`self._weighted = bool(recall_weighted_fusion and
    recall_relevance_primary)`), so `recall_weighted_fusion: false` is a one-line revert
    to v1.9.0 fusion, seeding and `score` magnitudes. The default is not a judgement:
    AC-136 makes it mechanical — any red among AC-121, AC-122, AC-123, AC-124, AC-125,
    AC-133 ships `False` and returns the change to FORGE. D5's determinism fixes sit
    deliberately OUTSIDE the flag, because gating a determinism fix leaves the flag-off
    path irreproducible.

safety_invariant: >
  Flag-off (`recall_weighted_fusion: false`) restores v1.9.0 fusion; flag-off on
  `recall_relevance_primary` restores pre-1.9.0 retrieval byte-identically, and weighting
  is subsumed under it so #36's frozen AC-008/AC-009 are never reached by this change.
  The selectivity numerator and denominator are drawn from the SAME population on both the
  layer axis and the status axis — `N_scoped` counted over `target_layers`, status
  population resolved by `recall_active_only` and applied to BOTH ends. AC-142's two
  assertions are complementary, not redundant: the invariant `n_sparse <= n_scoped`
  catches a mixed population, and `w_sparse == 1.0` catches the reverse mismatch, which
  satisfies the invariant and would otherwise pass unseen.
  The preliminary fusion that produces `seed_ids` reads base arms only (invariant I-1), so
  a derived arm can never influence its own seeds.
  `rrf_merge` / `rrf_merge_scored` bodies are untouched and `test_rrf.py`'s pre-existing
  classes stay byte-identical, so their continued green is a real non-regression signal.
  Every attack in the plan carries a falsifiability precondition that must go green first
  (AC-139 for AC-138, AC-141 for AC-140); an attack whose precondition is not green is
  recorded INDETERMINATE and returned to FORGE, never resolved by an implementer.

invariants:
  - weighted-fusion-subsumed-by-relevance-primary   # self._weighted = recall_weighted_fusion AND recall_relevance_primary; None-sentinel at both production sites (server.py:548, __main__.py:340); AC-120 pins it (DP-4)
  - legacy-rrf-functions-untouched   # rrf_merge/rrf_merge_scored bodies unchanged, weighted_rrf_merge_scored added beside them; test_rrf.py TestRrfMerge byte-identical (AC-106, C-1 fence)
  - derived-family-is-one-voter   # graph+completion collapsed by min-rank into derived_ranking before fusion; a candidate in both contributes exactly one term (AC-107); identity holds bitwise when completion is off (AC-108/AC-135)
  - population-parity-both-axes   # selectivity numerator and denominator share layer scope AND status population; n_scoped over target_layers, status per recall_active_only, applied to both ends (DP-3/DP-9, AC-134/AC-142)
  - no-status-predicate-on-bm25-search   # active-only numerator computed WITHIN sparse_ranking for weight purposes only; bm25_search is shared and stays untouched (DP-9, verified empty-diff)
  - prelim-reads-base-arms-only   # invariant I-1: the seeding fusion never reads graph_ranking or completion_ranking, so derived arms cannot influence their own seeds (AC-114)
  - fetch-width-unchanged   # fetch_width = max(k, FETCH_WIDTH_FLOOR=10) is untouched; D4 changed seed COMPOSITION, never seed COUNT (AC-115); #36 seam 3b intact
  - determinism-outside-the-flag   # D5's sorted(neighbour_ids) and (-score, id) completion sort ship ungated — gating a determinism fix would leave the flag-off path irreproducible
  - store-layer-untouched   # storage/graph.py and storage/relational.py both empty-diff; anomaly A routed to F-A, no consumer-side workaround (DP-8 rejected it by name)
  - falsifiability-precondition-per-attack   # AC-139 gates AC-138, AC-141 gates AC-140; a precondition that is not green makes its attack INDETERMINATE and returns it to FORGE, never weakened by the implementer
  - oracle-must-differ-not-merely-hold   # standing rule earned by R-7 firing three times in review; a criterion must be shown to differ across the implementations it claims to distinguish
  - red-first-evidence-on-record   # RED-first demonstrations recorded in red-evidence.txt before the fix, including AC-131's remediated id pair found by a 201-candidate search

known_gaps:
  - >-
    AC-138 / AC-139 INDETERMINATE (criteria-legal, attribution corrected): C-2 requires the
    floor-10 and floor-1000 rank distributions to be disjoint; measured `{1,1,1}` vs
    `{1,1,1}` (reverted) and `{0,0,0}` vs `{0,0,0}` (fixed) across seeds 0-2. They overlap,
    so AC-139 is INDETERMINATE — which is not green — and AC-138 is unfalsifiable and NOT
    claimed as discharged. The attribution is a MEASURED mechanism, not a borrowed excuse:
    the floor channel IS live, but an id-ascending tiebreak (`"N1" < "target"`) masks it at
    the final rank. Neither criterion is among AC-136's six, so the shipped default is
    untouched. Exactly the outcome DP-8's [RISK] and C-2 pre-registered.
  - >-
    F-A / anomaly A (high, follow-up, MUST be opened before the tag): `graph.py:205-256`
    wraps the whole `for seed_id in seed_ids` loop in one `try`, and Kuzu raises at cursor
    exhaustion, so `neighbor_expand(seeds)` is equivalent to `neighbor_expand([seeds[0]])`;
    `decaying_walk` passes `list(frontier)` from a set, so WHICH seed survives is
    hash-random. This is membership nondeterminism, which D5's ordering fixes do not touch —
    all of #38's measurements were taken on a one-seed expansion. Checker's correction,
    recorded: fixing F-A alone will NOT unblock AC-138/AC-139, because their indeterminacy
    is caused by the tiebreak mask, not by anomaly A.
  - >-
    F-B / anomaly B (med, follow-up): `neighbor_expand` filters `if neighbor_id not in
    seed_ids` and `decaying_walk` seeds `visited = set(seed_ids)`, so a record at or above
    seed rank can never receive graph or completion credit. Consequence of record: #38's
    own acceptance sketch — competitors at dense ranks 1-3 that ALSO carry derived votes —
    describes a configuration the code cannot produce, confirmed unbuildable by the
    measurement. The shipped fixture carries a better and real instance of the same class
    (spoke1 outranking hub).
  - >-
    F-C / anomaly C — the retrieval gate's fixture is confounded and its isolation
    docstring is false (med-high, follow-up): measured edge counts flat 2 / context 2 /
    completion 142 / both 142, because `server.py:522,535` ties `link_cooccurrence` to
    `config.recall_completion`, so the flag under test changes the commit-time graph;
    `recent_crystal_ids` resolves to the 5 first-committed crystals because the fixture
    stamps an identical `_T0`. Binding interpretation rule (C-5): AC-124 is a
    NON-REGRESSION TRIPWIRE, never a retrieval-quality claim, until F-C lands.
  - >-
    F-V9 (NOTE) — AC-125's unweighted arm is now partly tiebreak-driven: after the fixture
    was enlarged, at seeds where the completion lottery loses the arm's `target_rank != 0`
    is delivered by `"N1" < "target"` at an exact `1/61` score tie rather than by the
    phantom collecting two derived votes. AC-125's THEN still holds and the A/B still
    isolates the flag — the WEIGHTED arm's rank-0 remains genuinely boost-driven, which is
    the half carrying the fusion claim — but the gate's negative half is partly an
    alphabetical artifact. Deliberate and disclosed; belongs to the follow-up that revisits
    this fixture.
  - >-
    release-image `__version__` probe (pre-existing, blocks the digest not the merge):
    `crystalium.__version__` resolves to `1.4.0` from stale baked-venv dist metadata, on
    this branch AND on `ef42967`. The image must be rebuilt and probed so `__version__`
    reports `1.10.0` before its digest enters the roster — the DP-R5 guard pattern from the
    #36 release train.
  - >-
    D-1 cross-layer rank blocking (med-high, deferred by DP-5 with evidence landed):
    `retrieve.py:326-360` appends per layer over `_ALL_LAYERS`, so with `layers=None` an
    episodic hit always precedes every semantic hit regardless of BM25 score; the inversion
    fires at `j >= 1`. Arm-internal, so the sparse boost cannot correct it. AC-126's
    `cross_layer` axis is the evidence; the gate lands before the fix.

