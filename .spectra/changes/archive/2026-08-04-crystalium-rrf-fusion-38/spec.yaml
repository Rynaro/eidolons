test_harness:
  runner: >-
    Container-first. `make test` = `docker compose run --rm crystalium pytest
    mcp-server/tests/ -v`; a real daemon is required for the graph and vector stores.
  eval_gate: >-
    `python -m evals retrieval-gate` (AC-124 non-regression tripwire, AC-133 context axis)
    and `python -m evals fusion-gate` (AC-125 A/B, AC-126 cross-layer, AC-138/AC-139 floor
    inflation). `eval-before.json` MUST be captured before any code change; the threshold
    is the measured baseline, never a modelled figure from `spec.md`.
  multi_run_protocol: >-
    C-2 — every real-`GraphStore` rank criterion is evaluated across multiple
    `PYTHONHASHSEED` values, and a split verdict is RED and a finding, never a retry.
    Distributions that overlap where C-2 requires disjointness make the criterion
    INDETERMINATE, which is not green.
  red_first: >-
    RED-first demonstrations recorded in `red-evidence.txt` at `ef42967` before the fix.
    AC-131's originally recorded pair proved irreproducible at review — reverting D5 did
    not change the fused order anywhere in `PYTHONHASHSEED` 0..4, the exact window AC-131's
    frozen VERIFY names; divergence first appeared at seed 6 and recurred at 9, 15, 17, 18.
    That made attack D unable to redden AC-131, turning AC-130 RED (F-V1). Widening the
    window was NOT legal (it would amend a frozen criterion, forbidden by C-15), so the
    remedy was new fixture ids selected by MEASUREMENT: 201 candidate >=4-distinct
    UUID-shaped sets swept, 65 of which disagree inside 0..4 under this test's exact
    completion-score scheme. The selected ids are pinned as
    `test_fusion_weighting.py::_DETERMINISM_IDS`, and the observed disagreeing seed pair
    required by AC-131's frozen text is (0, 1), reproduced by the checker seed for seed.
  requires_real_daemon: true   # docker; make test, the retrieval gate and the fusion gate all execute inside the crystalium container

# Mechanically distilled from the frozen `spec.criteria.md`
# (sha256 e644052e868db47b49c7daedba904e9f53b67d401c81bde0b5e2887ffcb2fded, amended 4x).
# The criteria file remains authoritative; each `verify` below is that block's VERIFY line,
# with the per-criterion rationale and measurement tables left in the criteria file.
acceptance_checks:
- id: AC-101
  form: event-driven
  given: the sketch fixture with `recall_relevance_primary` enabled together with the weighted
  when: '`Aetheryte.recall()` is called with `k=10`'
  then: the system shall return the target crystal's id as `result.records[0].id`
  verify: '`pytest mcp-server/tests/test_fusion_weighting.py::TestIssue38Sketch::test_target_is_fusion_rank_1`
    — must be demonstrated RED at `ef42967`. Asserts fusion rank 1, not membership; membership is what
    the v1.9.0 fetch-width floor already provides. Non-floor-borne-ness is AC-138/AC-139''s job, not
    this node''s.'
- id: AC-102
  form: event-driven
  given: the sketch fixture in the default configuration
  when: '`Aetheryte.recall()` is called once per value of `k` drawn from 1, 3, 5, 10, 25'
  then: the system shall return the target crystal's id as `result.records[0].id` at every one of those
    values
  verify: '`pytest mcp-server/tests/test_fusion_weighting.py::TestIssue38Sketch::test_rank_1_is_k_independent`
    parameterised over `k in (1,3,5,10,25)` — the issue''s "should win fusion at ANY k".'
- id: AC-103
  form: unwanted-behavior
  given: the sketch fixture with the weighted fusion path disabled
  when: '`Aetheryte.recall()` is called with `k=10`'
  then: the system shall return an id other than the target's as `result.records[0].id`
  verify: '`pytest mcp-server/tests/test_fusion_weighting.py::TestIssue38Sketch::test_unweighted_path_ranks_target_below_first`
    — the gate''s own gate. If this node cannot go red, AC-101 is passing for some reason other than
    the fix.'
- id: AC-104
  form: ubiquitous
  given: any ranking set in which every arm weight is 1.0
  when: '`weighted_rrf_merge_scored` is called on it'
  then: the system shall produce the same `(id, score)` multiset that `rrf_merge_scored` produces for
    the same input
  verify: '`pytest mcp-server/tests/test_rrf.py::TestWeightedRrf::test_unit_weights_match_legacy_scores`
    over the existing `test_rrf.py` fixture corpus, **plus the discordant fixture `[["b"], ["a"]]`,
    plus an intra-list-duplicate fixture such as `[["a", "b", "a"]]`**. The duplicate fixture is required
    by vigil B-4: `rrf_merge_scored` accumulates one term *per occurrence* (`retrieve.py:82-86`, and
    its docstring blesses the case — "Duplicates within a single list are allowed but unusual"), so
    `weighted_rrf_merge_scored` must do the same or this criterion is green only because the shipped
    corpus happens to contain no intra-list duplicate. §D1''s docstring must state the per-occurrence
    rule explicitly. **AMENDED (vigil F4/A-11):** revision 1.0.0 asserted "the same id sequence", which
    contradicts AC-105''s deliberate id-ascending tie-break. Measured counterexample: `[["b"],["a"]]`
    -> legacy `[''b'',''a'']` (insertion order), weighted-at-1.0 `[''a'',''b'']` (id ascending) — while
    the score multiset is identical. Revision 1.0.0 was green only because every tie in the shipped
    corpus happens to be insertion-order-concordant. The unverifiable "at most one derived arm present"
    clause is also dropped: the function takes `list[tuple[list[str], float]]` and has no notion of
    a derived arm.'
- id: AC-105
  form: ubiquitous
  given: two candidates whose weighted fusion scores are exactly equal
  when: '`weighted_rrf_merge_scored` orders them'
  then: the system shall place the lexicographically smaller id first
  verify: '`pytest mcp-server/tests/test_rrf.py::TestWeightedRrf::test_exact_tie_breaks_by_id_ascending`
    with the arms supplied in both possible orders — an insertion-order tie-break is not stable under
    P3.'
- id: AC-106
  form: state-driven
