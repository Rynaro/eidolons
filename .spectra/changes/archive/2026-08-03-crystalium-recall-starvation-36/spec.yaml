  - id: AC-016
    form: event-driven
    given: "a store whose filtered candidate count exceeds `k` in the default configuration"
    when: "`Aetheryte.recall()` returns"
    then: >-
      the system shall report `budget.truncated_count` equal to the count of candidates
      actually removed by the `k` slice
    verify: >-
      `pytest mcp-server/tests/test_recall_starvation.py::TestBudgetSurfaced::test_truncated_count_derived_from_real_slice`
      — DP-7; strengthened per DP-R3/C-14. The oracle asserts the identity
      `len(result.records) + budget.truncated_count == <filtered candidate count before
      the slice>`, so a counter derived from pre-slice intent cannot pass: under attack D
      (delete `filtered_ids = filtered_ids[:k]`, keep the counter) the shipped object
      reported five drops that never happened while the old arithmetic oracle stayed
      green (`verification.md` F-V3). Attack D must turn this node RED.

