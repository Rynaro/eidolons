schema: eidolons/change-spec.v1
change_id: crystalium-recall-starvation-36
tier: full
maker: vivi
checker: vigil
target: crystalium — recall relevance-primary composition + k cap + cold-start importance (fix Rynaro/crystalium#36, ships v1.9.0)

problem: >
  `crystalium.recall` returns records ordered and selected entirely without reference
  to the query. The hybrid BM25 + dense + graph arms fuse into an RRF relevance ranking
  (`rrf_merge`, `retrieve.py:53-80`, called at `retrieve.py:339`), but that ranking only
  decides which crystals get *fetched* into `all_candidates` / `filtered_ids` — the full
  filtered set, however large, is handed to `Composer.compose()`
  (`retrieve.py:488-492,500`), whose signature takes no `k` and no relevance
  (`composer.py:179`) and whose sole ordering key is
  `_eviction_key(rec) -> (importance, last_access, id)` (`composer.py:122-134`).
  `_ComposerRecord` does not even carry a relevance field. Meanwhile every
  episodic/procedural/semantic commit writes `"importance": 0.0` literally
  (`episodic.py:176,191,262`; `procedural.py:149,193`; `semantic.py:233,287,380`)
  despite each layer being handed an `importance_fn` in its constructor that it never
  calls — and a crystal's only routes off 0.0 are the post-composition access loop
  (which runs only for records that already survived eviction) or the idle-gated Dream
  sweep. The three mechanisms compose into a closed starvation loop (issue #36): a
  freshly committed crystal is pinned at importance 0.0, loses every eviction round to
  any older record with accumulated history regardless of topic, and can never earn the
  access event that would raise its importance. `k` is not a cap at all (it only sizes
  `candidate_k = max(k*3, 10)` and the graph seed set), so `k=3` and `k=15` produce
  identical result sets; and `CrystalSummary.score` is declared `Optional[float] = None`
  and never passed at its single construction site, so ranking is not even inspectable
  from the client. Net: `commit` is silently write-only storage.

decision:
  selected: relevance-primary flag-gated composition (O1 + top-k gate + seam-3b fetch-width floor)
  scores: { H-E-prime: 85.5, H-E: 85.0, H-A: 77.0, H-B: 72.5, H-D: 70.5, H-C: 60.0 }  # H-E-prime (top-k gate + relevance-primary key, DP-1=O1) selected/ratified; rest scored solid-to-weak, see spec.md Rejected Alternatives table
  rejected:
    - >-
      O3-gate-only (H-E, 85.0 elite, within 0.6 pts of selected): rejected — fixes #36
      only probabilistically (the dense arm surfaces topically-weak neighbours into the
      top-k, and on slot overflow Pass-1 eviction still pops the rank-1 importance-0.0
      fresh crystal before a rank-5 stale one); AC-004 is unprovable under it; retained
      only as an emergency fallback if the composer change proved unshippable.
    - >-
      C-flag-default-off (H-B, 72.5 solid): rejected — violates mission P0-1 (the fix
      must hold by default); its earn-it-on eval cannot even measure the behaviour, since
      the retrieval_gate corpus never triggers eviction.
    - >-
      budget-scaling (DP-3b options B/C): rejected — mechanically blocked, not merely
      unconventional: two independent hard validators (`schemas.py:245` `le=3500`, and
      `schemas/recall-result.v1.json`'s `maximum: 3500`) plus the P0-9 assertion at
      `composer.py:269-272` make a scaled budget raise `ValidationError` inside
      `recall()`.
    - >-
      legacy-unclamped-importance (DP-4 bare option A, the planner's provisional rec):
      rejected — the measured legacy-scorer cold start (0.525) would be a *permanent*
      starvation inversion under `evb_enabled=False` (no Dream write-back there, so the
      commit-time value is durable), ranking above a proven-useful 0.403 record; a
      documented caveat is not a guard.
    - >-
      doc-caveat-instead-of-fetch-width-guard (DP-R1 option (a), post-verification):
      rejected — a recommendation string cannot fire; it would be the release's only
      defence on a MAJOR finding (F-V1: fresh crystal not returned at k=1/k=3 in the
      default configuration).
  safety_default: >-
    `Config.recall_relevance_primary` defaults `true` (the fix is on-by-default per
    mission P0-1); `recall_relevance_primary: false` is the one-line config revert,
    live in the same release, restoring pre-1.9.0 composition byte-identically — chosen
    over a no-flag design specifically so the highest-impact risk (an unknown real
    corpus regressing) has a cheap, immediate mitigation (DP-2 ruling B).

safety_invariant: >
  Flag-off (`recall_relevance_primary: false`) restores pre-fix retrieval
  byte-identically and never caps at `k`. With the flag on, `[:k]` is the only consumer
  of the caller's `k` — fetch/seed width is floored at `max(k, FETCH_WIDTH_FLOOR=10)`
  so a small `k` cannot shrink the ranking universe.
  `COLD_START_IMPORTANCE_CEILING = 0.30` bounds every commit-time `utility.importance`
  value, mechanically (not by comment), so the legacy scorer's unclamped cold start
  (0.525) can never invert the ranking.
  `evicted_count`'s meaning is never redefined: it keeps counting only token-budget
  evictions; `k`-truncation is counted separately in `budget.truncated_count` /
  `explain.truncated_by_k`, both derived from the *performed* slice, never from
  pre-slice intent, so `k_applied <= k_requested` holds by construction.
  The oversized-summary advisory is advisory-only (never a rejection) and
  exception-safe — any tokenizer exception skips it silently and never fails or delays
  a commit (fail-open).

invariants:
  - flag-gates-three-seams-plus-fetch-width-as-one-unit   # recall_relevance_primary reverts seams 3+3b+4+5 together (C-1, C-12); score/budget/explain/k-clamp/commit-side changes stay live in both modes
  - k-response-cap-not-ranking-universe   # the [:k] response slice is the only consumer of caller k; arm seeding uses fetch_width = max(k, FETCH_WIDTH_FLOOR=10) (DP-R1/C-12, seam 3b)
  - slice-derived-diagnostics-never-intent   # truncated_count/k_applied computed from the performed slice, not pre-slice intent (DP-R3/C-14); k_applied <= k_requested holds by construction
  - cold-start-ceiling-0.30   # COLD_START_IMPORTANCE_CEILING named constant clamps min(importance_fn(...), 0.30) at every commit-time call site (DP-4/C-3)
  - utility-importance-only-never-memory-dynamics   # initial_importance() writes utility.importance only; memory_dynamics stays Dream's writer, never touched at commit (DP-4a)
  - no-backfill   # existing 0.0-importance rows are untouched; rescued only by D1's relevance ranking, never by a migration (DP-4b, mission P0-3)
  - execution-0.5-special-case   # execution.py's hardcoded 0.5 stays untouched, one-line comment marking it a deliberate currently-active-work privilege above the 0.30 ceiling (DP-4d)
  - evicted-count-meaning-preserved   # evicted_count keeps its exact pre-existing meaning (token-budget drops only); k-truncation counted only in budget.truncated_count / explain.truncated_by_k (DP-7)
  - schema-strict-budget-loose-explain   # recall-result.v1.json declares budget strictly (five fields, additionalProperties false) and explain loosely (additionalProperties true, diagnostic/unstable) (DP-X)
  - no-t2-promotion-promise   # TIER_VIOLATION advice names the procedural fallback but never states or implies T2->semantic promotion; T2 always stays candidate per gate.py G2 (C-9, mission P0-4)
  - red-first-evidence-on-record   # C-5-mandated criteria (plus AC-031 per C-12) demonstrated failing before the fix, with failing output recorded in the verify artefact

known_gaps:
  - >-
    flag-off-k-applied-intent-derived (F-V10, NOTE): with `recall_relevance_primary:
    false`, `budget.k_applied` is the one field still derived from intent
    (`min(k_requested, len(before))`) rather than a performed slice, because no slice
    runs in that mode. Not a criterion failure — frozen AC-017 binds "any recall in any
    configuration" and the current value satisfies it (the pre-patch flag-off value did
    not); `truncated_count` stays honest (0) in both modes. Recorded so `k_applied`
    under flag-off is never misread as a returned-record count.
  - >-
    flag-off-ordering-nondeterminism (F-V11, NOTE): flag-off recall ordering is
    run-to-run non-deterministic at both the pre-fix and shipped commits, traced to the
    narrow-seed graph arm (`seed_ids = dense_ranking[:k]` concentrates the walk) and
    Kuzu `neighbor_expand` flakiness. Pre-existing, untouched by this patch, and
    *reduced* by it — the flag-on column is now bit-stable across repeats via seam 3b.
    Violates no criterion; worth its own issue alongside the unweighted-RRF follow-up.
  - >-
    AC-017-verify-prose-contradiction (F-V12, NOTE): `spec.criteria.md`'s AC-017 VERIFY
    text asserts both "true by construction" and "Attack D must turn this node RED" —
    the two cannot both hold, and the shipped, ruled-correct by-construction design
    (`k_applied = min(k_requested, len(before))`) makes the RED claim false, as the
    final pre-tag attack-D re-run measured (AC-017 stayed GREEN; a separate attack D′
    proved the node is a live gate on the arithmetic it actually claims). Text-only
    defect in the criteria file's prose, not the implementation; fix at the next legal
    `ramza-freeze --amend --reason`, not a release blocker.
  - >-
    unweighted-rrf-root-deferred: the deeper pre-existing root that lets an unweighted
    3-arm graph neighbour outvote a 2-arm exact lexical match in RRF fusion is not fixed
    in this release (it touches fusion at every `k` and needs eval evidence). Opened as
    a follow-up issue per DP-R1's ruling; explicitly out of scope here.

