test_harness:
  runner: >-
    Container-first pytest via `make test` -> `docker compose run --rm crystalium
    pytest mcp-server/tests/ -v` (Makefile:27-28); `make test-fast` skips
    `@pytest.mark.slow` model-download and eval-gate tests; the new regression suite
    (`test_recall_starvation.py`) carries no `@pytest.mark.slow` marker and must run
    under `make test-fast`.
  slow_gates: >-
    `@pytest.mark.slow`, invoked explicitly: `test_retrieval_gate.py`,
    `test_evb_gate.py`, `test_forgetting_gate.py`, `test_prefetch_gate.py`,
    `test_dream_gate.py` — all five ran and passed inside the full `make test` run per
    both verification attestations (Step 2, then R1), even though the spec's own
    printed slow-gate command block omits `test_dream_gate.py` (a documentation gap,
    discharged in fact by `make test`, per C-6).
  eval_gate: >-
    `python -m evals retrieval-gate` (`evals/retrieval_gate.py`) run before and after on
    the branch (C-6); both JSON outputs recorded (`eval-before.json`, `eval-after.json`)
    and independently reproduced exact by the checker on a second run; a flipped
    `completion_pass`/`context_pass` is a checker finding, never a test edit — none
    flipped.
  red_first: >-
    C-5/C-12: AC-001, AC-002, AC-004, AC-005, AC-010 (and AC-031 per C-12) demonstrated
    RED at the pre-fix baseline before the fix landed, with failing output recorded in
    `red-evidence.txt` and independently reproduced by the checker via a scratch git
    worktree, both as a collection-level `ImportError` and, under symbol-only shims, as
    a behavioural failure for the semantically correct reason on every C-5-mandated AC.
  requires_real_daemon: true   # docker; make test and the retrieval-gate eval both execute inside the crystalium docker-compose service, not on the host interpreter

acceptance_checks:
  - id: AC-001
    form: event-driven
    given: >-
      a store holding four high-importance crystals whose summaries do not contain the
      query tokens, plus one freshly committed crystal whose summary contains three
      distinctive low-frequency tokens, with `Config.slots["episodic"]` reduced so the
      candidate set overflows the slot
    when: >-
      `Aetheryte.recall()` is called with the same scope and a query composed of those
      three distinctive tokens
    then: the system shall include the freshly committed crystal's id in `result.records`
    verify: >-
      `pytest mcp-server/tests/test_recall_starvation.py::TestIssue36Regression::test_fresh_distinctive_crystal_is_returned`
      — C-5 RED-first at `af24493`.

  - id: AC-002
    form: event-driven
    given: a store holding eight crystals that all match the query, whose summaries fit within the slot budget
    when: "`Aetheryte.recall()` is called with `k=5`"
    then: the system shall return exactly five records
    verify: >-
      `pytest mcp-server/tests/test_recall_starvation.py::TestKIsACap::test_k5_returns_five_when_five_fit`
      — C-5 RED-first at `af24493`.

  - id: AC-003
    form: state-driven
    given: "`Config.recall_relevance_primary` is enabled"
    when: "`Aetheryte.recall()` returns for any store or query"
    then: "the system shall satisfy `len(result.records) <= k`"
    verify: >-
      `pytest mcp-server/tests/test_recall_starvation.py::TestKIsACap::test_never_exceeds_k`
      parameterised over `k in (1,3,5,10,15)`.

  - id: AC-004
    form: event-driven
    given: >-
      a store holding one irrelevant crystal at `utility.importance = 0.9` plus one
      query-relevant crystal at `utility.importance = 0.0`, with a slot cap admitting
      only one of them
    when: "`Aetheryte.recall()` is called with a query matching only the relevant crystal"
    then: the system shall return the relevant crystal rather than the high-importance one
    verify: >-
      `pytest mcp-server/tests/test_recall_starvation.py::TestRelevanceBeatsImportance::test_relevant_zero_importance_survives_eviction`
      — C-5 RED-first; provable only under DP-1 O1.

  - id: AC-005
    form: ubiquitous
    given: any non-empty recall result in the default configuration
    when: "the caller inspects any returned `CrystalSummary`"
    then: the system shall expose a non-null `score`
    verify: >-
      `pytest mcp-server/tests/test_recall_starvation.py::TestScorePopulated::test_score_is_not_none`
      — C-5 RED-first at `af24493`.

  - id: AC-006
    form: optional-feature
    given: "`Config.recall_relevance_primary` is set to `False`"
    when: "`Aetheryte.recall()` returns a non-empty result"
    then: the system shall still expose a non-null `score` on every record
    verify: >-
      `pytest mcp-server/tests/test_recall_starvation.py::TestScorePopulated::test_score_populated_when_flag_off`
      — DP-5 "both modes".

  - id: AC-007
    form: event-driven
    given: >-
      a default-configuration fixture of four candidate records carrying relevance 0.9,
      0.5, 0.1 and 0.05, routed to one slot whose cap is small enough to force at least
      one eviction
    when: "`Aetheryte.recall()` returns the surviving records"
    then: the system shall emit them in non-increasing `score` order
    verify: >-
      `pytest mcp-server/tests/test_recall_starvation.py::TestOrdering::test_evicting_slot_emits_descending_score`
      — DP-6; strengthened per DP-R2/C-13. The fixture MUST evict: Pass 1 reassembles an
      evicting slot from `remaining`, which is sorted *ascending* by eviction key, so
      without seam 5 an evicting slot emits worst-relevance-first. Gate proof: attack E
      (delete the seam-5 output sort) must turn this node RED — it stayed green against
      the previous non-evicting fixture (`verification.md` F-V2).

  - id: AC-008
    form: optional-feature
    given: "`Config.recall_relevance_primary` is set to `False`"
    when: "`Aetheryte.recall()` runs against a fixture that overflows a slot"
    then: the system shall reproduce the pre-fix composition result set
    verify: >-
      `pytest mcp-server/tests/test_recall_starvation.py::TestLegacyPath::test_flag_off_restores_prefix_behaviour`
      — C-1; load-bearing because DP-2 landed B.

  - id: AC-009
    form: optional-feature
    given: "`Config.recall_relevance_primary` is set to `False`"
    when: "`Aetheryte.recall()` is called with a `k` smaller than the candidate count"
    then: the system shall return more than `k` records
    verify: >-
