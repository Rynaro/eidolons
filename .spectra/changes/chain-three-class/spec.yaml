schema: eidolons/change-spec.v1
change_id: chain-three-class
tier: full
maker: vivi
checker: kupo
target: >
  nexus — add the missing three-class chain template so a "diagnose it, spec it,
  fix it" prompt stops falling back to a two-class chain that silently drops the
  diagnosis step (residual recorded by change `routing-recall-gap`, v2.18.0)

problem: >
  The routing kernel selects the matching chain template with the most
  `requires_classes` (`sort_by(-spec) | .[0]` in cli/src/run.sh). No template
  covered debugger+planner+coder. Measured on main @ 13013ae over a 13-prompt
  probe: all four debugger+planner+coder prompts selected the two-class
  `ship-fast` -> [ramza, vivi], and the scout+debugger+planner+coder prompt
  selected `plan-before-build`. In every case the DIAGNOSIS step was dropped —
  the router handed a planner a failure nobody had root-caused, and the dropped
  step left no trace in the artifact.

decision: >
  Add two template entries (DATA only; the selection algorithm is untouched, so
  invariant I-C2 holds). `diagnose-then-plan-then-fix` (vigil -> ramza -> vivi)
  covers debugger+planner+coder. `scout-diagnose-plan-fix` (atlas -> vigil ->
  ramza -> vivi) covers the four-class union and is NOT optional: jq's `sort_by`
  is stable, so two equal-specificity templates that both match are resolved by
  declaration order in the file. Adding the three-class template alone would
  have collided with `plan-before-build` on a scout+debugger+planner+coder
  prompt and created an eighth order-dependent tie. The four-class entry keeps
  specificity decisive.

safety_invariant: >
  No existing chain route changes. The 2-class templates, `plan-before-build`
  and `decide-then-implement` all resolve exactly as before; the `public` eval
  suite stays 15/15 and N-015 / N-C06 pin the two-class debugger and planner
  routes explicitly.

invariants:
  - The template list is NOT closed under union. FIVE equal-specificity pairs
    among the PRE-EXISTING two-class templates have no covering entry and remain
    decided by declaration order. They are PINNED by cli/tests/routing_chains.bats
    so an eighth cannot appear silently — recorded, not endorsed. An earlier
    draft of the chains: header comment claimed closure; that claim was audited
    before shipping and found FALSE, and the comment now states the narrower
    guarantee that actually holds.
  - A test written alongside the data it checks passes trivially. Every assertion
    in routing_chains.bats was falsified by mutation before being trusted.
  - Gilgamesh never appears in a chain template (Step-2(a) only); unchanged here.

anti_scope:
  - Do NOT resolve the five remaining ties. Each needs a semantic decision
    per pair, not a mechanism; widening scope to "fix ties" would be a different
    change.
  - No `priority` field, no change to the selection algorithm. DATA only.
  - The scout+debugger+coder combination (scout step dropped to
    `forensic-then-fix`) is left open and reported.

files_touched:
  - roster/routing.yaml              # the two template entries + the tie-break note
  - cli/tests/routing_chains.bats    # route pins + the ambiguity pin (new file)
  - evals/routing-suite.yaml         # recall coverage N-C01..N-C04, N-C06
  - methodology/cortex/chain-templates.md   # deep cortex table re-sync
  - CHANGELOG.md
  - VERSION                          # 2.18.0 -> 2.19.0
  - .spectra/changes/chain-three-class/     # this record

