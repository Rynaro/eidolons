    check: scout+debugger+coder selects scout-diagnose-fix -> [atlas, vigil, vivi, idg]
    evidence: recall suite N-C07, N-C09; routing_chains "scout step no longer dropped"
  - id: AC-2
    check: scout+debugger+coder+scriber no longer returns the read-only [atlas, idg]
    evidence: recall suite N-C08; routing_chains "read-only pair"
  - id: AC-3
    check: no existing chain route changes
    evidence: public 15/15; N-015 still [vigil, vivi]; N-C04 still scout-diagnose-plan-fix
  - id: AC-4
