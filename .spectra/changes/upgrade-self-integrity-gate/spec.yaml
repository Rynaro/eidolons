change_id: upgrade-self-integrity-gate
tier: full
maker: vivi
checker: vigil            # revisions <= 1.2.0 named kupo; change.json and the run of record both name vigil
spec_author: ramza
critic: ramza-critic-561
spec_revision: >
  1.5.0 — minimal amend, two criteria, nothing else re-litigated. Two independent
  verifiers disagreed about AC-25: the checker drove the STATUS VALUES and found
  the status->message mapping correct; the adversary drove REALITY and found the
  reality->status mapping wrong. Both were right about different layers. AC-26 - a
  REACHABLE upstream with no roster/index.yaml on its default branch is reported
  as `network` and disclosed as "upstream unreachable", a false statement about an
  upstream that answered; it must classify `absent`, with genuine unreachability
  unchanged as the negative control. AC-27 - the policy switch's `*)` catch-all is
  a FAIL-OPEN default inside a fail-closed change: any unanticipated return code
  reads as `verified`, measured end to end at exit 0 under strict with no metadata
  anywhere. Also recorded WITHOUT criteria: verification.md's claim that
  yaml_to_json's die()/subshell path is unreachable is WRONG (both routes
  executed); a duplicate YAML key silently flips enforcement to warn under BOTH
  backends while `yq eval .` and `jq empty` exit 0 (out of scope - the instrument
  belongs in roster CI); three further residuals. Prior:
  1.4.0 — adversary round. An independent adversary broke the gate three ways
  and every claim was re-measured here by EXECUTING the shipped helper, not by
  reading it. THE VACUOUS-RECORD CLASS - a release record that exists but
  carries nothing comparable is classified `verified`, which FALSIFIES this
  record's own MONOTONE / fail-closed invariant in both directions (upstream +
  moved tag installs a backdoor at exit 0; one local file write with no hashes
  turns a strict refusal into `verified:local-only`). Plus the `<`-sentinel
  keyed on .commit alone, and a fail-open enforcement read. AC-21..AC-25 added;
  the placeholder row recorded as unreachable on a forward upgrade (OQ-2 NOT
  re-decided); two residuals and two out-of-scope follow-ups filed. Prior:
  1.3.0 — post-rejection record amend. The evidence VARIABLE VALUE
  `skipped:non-tag` and the SUMMARY DISPLAY STRING `UNVERIFIED - non-tag ref`
  are separated at every mention, and AC-17 now asserts the display string —
  the implementation was correct and is unchanged; the record was wrong. The
  variable's closed set drops from eight to SEVEN (the eighth was never a
  variable value; assigning it on the non-tag branch would make AC-18
  unfailable). AC-15 ruled MET and ruled blind to semantic drift; AC-19 ruled
  MET AS FROZEN and closed. Prior:
  1.2.0 — coordinator amend hop: doc surfaces brought into declared_scope, AC-15
  restated as a set, AC-19/AC-20 added, OQ-4 ruled closed. Prior:
  1.1.0 — applies critic ramza-critic-561 ACCEPT-WITH-CHANGES: B-1 (no-evidence
  precedence), B-2 (S6 record corrected), B-3 (non-tag path in scope), and
  N-1..N-7. Every critic claim was independently re-measured before adoption;
  one stated mechanism (B-2's cause) was falsified and is corrected below.
closes: "https://github.com/Rynaro/eidolons/issues/561"
measured_on: "main @ 933f36b (VERSION 2.20.0)"

target: >
  nexus — make `eidolons upgrade self` actually verify the payload it installs,
  by reading the target release's integrity metadata from the only source that
  can structurally contain it; refuse (or loudly label) an upgrade that was not
  verified; and stop the sibling non-tag path from claiming a verification it
  never performs.

problem: >
  nexus_verify_release (cli/src/lib.sh:994) reads expected metadata from
  $ROSTER_FILE, which cli/src/lib.sh:13 defines as $NEXUS/roster/index.yaml —
  the CURRENTLY INSTALLED nexus, not the clone being verified. A release's
  commit/tree/archive_sha256 are recorded in a `chore(roster): record nexus
  vX.Y.Z release integrity metadata` PR that merges AFTER the tag, so no tag's
  tree can ever contain its own metadata. Neither candidate local source can
  hold the answer, so every forward upgrade misses the lookup and takes the
  fail-open early return at lib.sh:1009-1012. upgrade_self.sh:285-299 refuses
  correctly on rc 2 (drift) and rc 3 (corrupt clone); neither is reachable when
  the metadata is absent. Observed live on 2.14.1 -> 2.20.0: exit 0, nothing
  cryptographically checked, with a warning that reads like a benign edge case.
  SECOND LIVE INSTANCE, same defect class - the non-tag branch at
  upgrade_self.sh:299-301 completes an upgrade after printing "commit SHA
  verified", which is false; nothing on that branch verifies a commit SHA.

measurements: >
  Every claim below was run, not reasoned, on 2026-08-10.
  (1) `git clone --depth 1 --branch v2.20.0` then
  `git show HEAD:roster/index.yaml | yq '.nexus.versions.releases."2.20.0"'`
  returns ABSENT — a tag's tree does not carry its own metadata.
  (2) From that same shallow tag clone, `git fetch --depth 1 origin HEAD` then
  `git show FETCH_HEAD:roster/index.yaml` returns
  commit 2cd2d0984e3f06ebad33bab9f9bb354ca57f83ec,
  tree 85a3c084cd673f229b8d043f703cb1b43ad3234a,
  archive_sha256 2bcafa316ffafc73944612b979fe64088275c5815531b18e5acf0f65794010e1,
  and all three match the clone byte-for-byte.
  (3) `git ls-remote --symref https://github.com/Rynaro/eidolons HEAD` returns
  `ref: refs/heads/main HEAD`, so `origin HEAD` resolves against real GitHub.
  (4) A bats-style fixture remote made with `git init` (init.defaultBranch
  unset) has default branch `master`; `fetch --depth 1 origin main` against it
  exits 128 while `origin HEAD` succeeds.
  (5) After push_fixture_tag "1.0.1" the upstream roster holds
  `<filled-by-release-workflow>` for 1.0.1 while the installed roster holds no
  entry at all — upstream=placeholder + installed=absent is a LIVE forward-
  upgrade state, not a corner case.
  (6) `upgrade self --ref master --force` on the fixture exits 0, prints
  "Non-tag ref 'master': commit SHA verified, tree/archive checks skipped." and
  "Upgraded nexus 1.0.0 -> master".
  (7) Both S4 non-tag tests exit 1 at "Failed to clone" and assert only
  `status -ne 5`, so they pass without exercising the path.
  (8) `git -C "$FIXTURE_REMOTE" symbolic-ref HEAD refs/heads/no-such-branch`
  leaves `clone --branch v1.0.1` at rc 0 while `fetch --depth 1 origin HEAD`
  exits 128 — the reachable mechanism for the network case.
  (9) bats cli/tests/upgrade_self.bats on 933f36b = 18/18 green.

decision: >
  Read the expected metadata from the upstream DEFAULT BRANCH, reached through
  the remote the fresh clone already has. nexus_clone_to_sibling sets origin to
  ${EIDOLONS_REPO:-https://github.com/Rynaro/eidolons}, so
  `git -C "$NEXUS_NEW" fetch --depth 1 origin HEAD` followed by
  `git show FETCH_HEAD:roster/index.yaml` reaches it — and works offline
  against the bats fixture remote, which is what makes the fix testable at all.
  The ref is literally HEAD - no `main` fallback and NO environment override.
  The upstream source does not REPLACE the installed roster, it JOINS it. Every
  source that yields a record must agree with the payload; any disagreement is
  a mismatch. This is monotone - adding a source can only make verification
  stricter - and the installed roster is the only witness that predates the
  current fetch, so it is the only one that can notice a tag that moved since
  the last sync.
  nexus_verify_release classifies EVIDENCE and upgrade_self.sh applies POLICY,
  mirroring verify.sh:68 and doctor.sh:230, which both consult
  integrity_enforcement_mode at their own call sites.

vacuous_record_class: >
  ADDED IN 1.4.0. MEASURED BY EXECUTING _nexus_release_source_status
  (cli/src/lib.sh:1040-1089) DIRECTLY, not by reading it. The helper SKIPS each
  field comparison when the expected value is empty (:1060, :1065-1066,
  :1075-1076) and then falls through to `echo "verified"` (:1088), so A RECORD
  WITH NOTHING TO COMPARE IS CLASSIFIED AS A POSITIVE VERIFICATION. All four of
  these return `verified` - {tag, released_at} only; commit/tree/archive_sha256
  all present but empty; a non-object scalar (jq errors to stderr, the values
  come back empty, the fall-through still fires); and commit ABSENT while
  tree/archive_sha256 hold `<`-sentinels, because the sentinel CLASSIFICATION is
  keyed on .commit alone at :1056 while the other two are silently skipped.
  {tag, released_at} is SCHEMA-LEGAL - schemas/roster.schema.json:41 requires
  only tag and released_at.
  BOTH DIRECTIONS LAND. Upstream record + a tag moved to a backdoored commit
  installs the backdoor at `verified`, exit 0. The same shape written into the
  INSTALLED roster - one file write, no hash knowledge, no origin control -
  turns a strict refusal into `verified:local-only`, exit 0.
  WHY THE RECORD MISSED IT - the critic's B-1 severity rule closes the
  neighbouring `commit: "<x"` route (confirmed, it refuses), and every criterion
  through revision 1.3.0 built records that HAD hashes; AC-16b reaches the
  placeholder and never builds a record with missing hash fields. A
  monotonicity argument protects only against sources that DISAGREE and says
  nothing about a source that AGREES VACUOUSLY. The record reasoned about
  conflict between sources and never about emptiness within one.
  CLOSED BY AC-21 (classify on what was actually compared) and AC-22 (sentinel
  scope). Until they land, the MONOTONE invariant below is FALSE AS SHIPPED.

enforcement_read: >
  ADDED IN 1.4.0. integrity_enforcement_mode (lib.sh:212-220) echoes
  EIDOLONS_INTEGRITY_ENFORCEMENT VERBATIM and the call site compares it exactly
  (upgrade_self.sh:335), so STRICT, Strict, " strict" and any unrecognised token
  all select the permissive branch - measured. On the roster path the read is
  fail-open by construction - `set -o pipefail` makes a failing yaml_to_json
  fire `|| echo "warn"`, so an unreadable or unparseable roster (and a box with
  no yq and no python3-yaml) resolves to the literal `warn`, which is
  INDISTINGUISHABLE AT THE CALL SITE from a roster that says warn. A third
  branch returns the EMPTY STRING - when yaml_to_json exits 0 with no output,
  jq emits nothing and the `|| echo "warn"` never fires (measured as a code
  path; no real roster is known to reach it).
  THE EVIDENCE READ IS FAIL-CLOSED WHILE THE POLICY READ IS FAIL-OPEN, and this
  change is what makes that helper gate a REFUSAL for the first time. AC-23
  closes it AT THE upgrade_self.sh CALL SITE ONLY - see anti_scope.

severity_precedence: >
  ADDED IN 1.1.0 (critic B-1). Sources can disagree about WHICH KIND of
  no-evidence they hold, and the policy table gives those tokens opposite
  outcomes under strict. The selector is part of the contract:
  mismatch > corrupt > absent > network > placeholder.
  The most severe outcome reported by ANY source wins. Two grounds, both
  measured. It is a LIVE INPUT - measurement (5) above shows
  upstream=placeholder + installed=absent is the state of every forward-upgrade
  fixture after push_fixture_tag, and without a selector strict yields exit 0
  or exit 5 on that state depending on an unwritten rule, making AC-4 and AC-9
  contradictory. And it CLOSES A LOCAL-WRITE DOWNGRADE - an actor with only
  local file write (strictly weaker than origin control, which this change
  explicitly does not defend against) cannot forge a hash but can write
  `commit: "<x"` into the installed roster; under a placeholder-dominant rule
  that converts a strict refusal into a completed upgrade.

contract: >
  nexus_release_meta_upstream VERSION CLONE_DIR — stdout carries the release
  metadata JSON object and nothing else (empty when the ref parsed but has no
  entry); stderr carries all logging; rc 0 = source consulted, rc 1 = source
  unavailable. Running under `set -euo pipefail`, guard the print-if-non-empty
  tail with an `if`, never `[ -n "$x" ] && printf`.
  nexus_verify_release VERSION CLONE_DIR — writes NOTHING to stdout (its only
  caller does not capture stdout, so an echo would land raw in the user's
  terminal). Detail rides the variable NEXUS_VERIFY_STATUS, closed set of
  SEVEN VARIABLE VALUES - verified | verified:local-only | absent | placeholder
  | network | mismatch | corrupt. Return codes - 0 verified, 2 mismatch,
  3 corrupt clone, 4 no evidence. 0/2/3 keep today's meaning; 4 is new and
  today's fail-open 0 for an absent entry becomes 4.
  EVERY read of the variable must be ${NEXUS_VERIFY_STATUS:-}. On the non-tag
  branch nexus_verify_release is never called, and `set -euo pipefail` at
  upgrade_self.sh:24 turns an unguarded expansion into an `unbound variable`
  abort immediately before the summary line.

vocabulary: >
  ADDED IN 1.3.0. ONE OUTCOME IS NAMED AT THREE LAYERS AND THEY ARE NOT
  INTERCHANGEABLE. Merging any two is how AC-17 came to assert a string the
  implementation has never emitted.
  (a) EVIDENCE - the NEXUS_VERIFY_STATUS variable value, written only by
  nexus_verify_release; closed set of seven, listed under `contract` above.
  (b) OUTCOME LABEL - `skipped:non-tag`, this record's vocabulary only. It
  names the `—` row of the policy table. It is NOT a value of any variable and
  NOT a string the implementation contains - `grep -rn 'skipped:non-tag'
  cli/src/` returns nothing, BY DESIGN.
  (c) DISPLAY STRING - what the summary line shows (INTEGRITY_TOKEN in the
  implementation): verified | verified:local-only | UNVERIFIED - <evidence> |
  UNVERIFIED - non-tag ref.
  ONLY (c) IS OBSERVABLE ON THE SUMMARY LINE, SO ONLY (c) MAY BE ASSERTED
  THERE. On the non-tag branch NEXUS_VERIFY_STATUS is deliberately never
  assigned - that is what makes ${NEXUS_VERIFY_STATUS:-} load-bearing and AC-18
  non-vacuous. WITHDRAWN in 1.3.0: revisions <= 1.2.0 said `skipped:non-tag` is
  "set on the else branch", one line above the sentence requiring every read to
  tolerate it being unset. Both cannot hold, and assigning it would make AC-18
  unfailable.

policy_table: >
  Applied by upgrade_self.sh at the call site (line ~285), with the token
  selected by severity_precedence above when sources disagree.
  rc 0 (verified, verified:local-only) — proceed under every mode.
  rc 2 (mismatch) and rc 3 (corrupt) — refuse with exit 5 under EVERY mode and
  regardless of --allow-unverified. Unconditional by design.
  rc 4 with token `absent` or `network` — strict refuses (exit 5); warn warns
  and proceeds; --allow-unverified proceeds.
  rc 4 with token `placeholder` — warns and proceeds under both modes, keeping
  the bootstrap-window skip semantics the issue calls a separate intentional
  path.
  Outcome label `skipped:non-tag` (no rc; nexus_verify_release is not called,
  so no evidence value exists) — warns and proceeds under both modes, with the
  warning REWRITTEN so it no longer asserts that a commit SHA was verified. Its
  DISPLAY STRING on the summary line is `UNVERIFIED - non-tag ref`; the label
  itself never appears in the implementation.
  EVERY refusal removes $NEXUS_NEW before exiting, including the rc-4 strict
  refusals, identical to upgrade_self.sh:290 and :296.
  The escape hatch relaxes ONLY the no-evidence rows. A flag wide enough to
  swallow a detected mismatch is not an escape hatch, it is an off switch.

summary_line: >
  The terminal line carries the outcome on EVERY path that completes an
  upgrade, which is what makes the NO NEW SILENT SUCCESS invariant satisfiable
  rather than aspirational.
  `Upgraded nexus 2.14.1 -> 2.20.0 (integrity: verified)`
  `Upgraded nexus 2.14.1 -> 2.20.0 (integrity: UNVERIFIED - absent)`
  `Upgraded nexus 1.0.0 -> master (integrity: UNVERIFIED - non-tag ref)`

invariants:
  - >
    MONOTONE SOURCES. Adding a metadata source can only make verification
    stricter, never looser. A stale or locally-tampered installed roster can
    cause a refusal, never a pass.
    FALSIFIED AS SHIPPED, RESTORED BY AC-21/AC-22 (1.4.0) - see
    vacuous_record_class. A locally-written record of {tag, released_at}
    currently produces `verified:local-only` and exit 0. The second sentence of
    this invariant is an OBLIGATION ON THE CODE, not a description of it, until
    AC-21 and AC-22 are green.
  - >
    SEVERITY DOMINANCE. When sources report different outcomes, the most severe
    wins - mismatch > corrupt > absent > network > placeholder. No source's
    weaker report can mask another's stronger one. (Added in 1.1.0; the first
    five invariants covered per-source behaviour and none covered combination.)
  - >
    FAIL-CLOSED POLICY READ (added 1.4.0). On the upgrade path the enforcement
    decision must resolve to the REFUSING posture for every input that is not a
    recognised permissive value - unrecognised, empty, mixed-case,
    whitespace-padded, and an unparseable or unreadable roster. A gate whose
    evidence read is fail-closed and whose policy read is fail-open is not a
    gate; the policy read decides whether the evidence matters at all.
  - >
    THE ESCAPE HATCH CANNOT DISABLE THE GATE. Neither --allow-unverified nor
    EIDOLONS_INTEGRITY_ENFORCEMENT=warn can turn a detected mismatch into a
    completed upgrade.
  - >
    NO NEW SILENT SUCCESS. Every code path that completes an upgrade prints
    exactly one of the four closed DISPLAY STRINGS on the terminal summary line
    - verified | verified:local-only | UNVERIFIED - <evidence> | UNVERIFIED -
    non-tag ref - including the non-tag path, which today prints a false claim
    instead. It is the display string, never the evidence variable value and
    never an outcome label, that rides the summary line (see `vocabulary`).
  - >
    NO PATH CLAIMS A VERIFICATION IT DID NOT PERFORM. This is the defect in
    #561 stated as a rule rather than a case, which is why the non-tag warning
    is rewritten rather than filed as a residual.
  - >
    STDOUT PURITY. nexus_verify_release writes nothing to stdout; the new
    upstream helper writes only JSON there. lib.sh's stderr-only logging
    contract exists precisely so captured-stdout helpers stay uncorrupted, and
    this change adds one.
  - >
    A NETWORK FAILURE IS NOT AN ABSENCE. An unreachable upstream metadata
    source reports `network`, never `absent` and never `verified`. Under warn
    it is no worse than today, where the same situation upgrades silently.
    The SEVERITY RULE may still fold it - installed=absent + upstream=network
    selects `absent`, correctly refusing under strict but reporting a reason
    that does not name the suppressed witness. AC-25 (1.4.0) binds the refusal
    message and the summary reason to disclose it; the ORDER is not changed.
  - >
    TESTABILITY IS PART OF THE FIX. The mechanism must be exercisable by the
    existing bats harness. nexus_refresh is not, because it early-returns on
    EIDOLONS_NEXUS, which helpers.bash:32 and upgrade_self.bats:121 both set —
    an untestable gate in a repo whose recurring defect is gates that cannot
    fail.

rejected_alternatives:
  - >
    A — call nexus_refresh before verifying (the issue's remedy 1;
    ramza-score explore 54, weak). Rejected on two independent grounds, either
    fatal. UNTESTABLE — nexus_refresh returns 0 immediately when EIDOLONS_NEXUS
    is set (lib.sh:887) and the harness sets it for every test, so a fix built
    on it is inert in the whole suite. WRONG FOR A CHANNEL — nexus_refresh
    follows .roster_ref, and `stable` is a magic token resolved by
    nexus_latest_tag to the latest TAG, whose roster by construction still
    lacks the target's own metadata, so remedy A silently does nothing for
    stable-channel users.
  - >
    B — the upstream source REPLACES the installed roster (explore 74, solid).
    Correct on the reported defect and simpler. Rejected on MONOTONICITY ALONE -
    dropping a source can only weaken verification, and the installed roster is
    the only witness that predates the current fetch, so it is the only one
    that can notice a tag that moved since the last sync.
    WITHDRAWN GROUND, recorded rather than quietly dropped - revision 1.0.0 also
    rejected B because it would "delete a live guard" by shadowing S6's tamper.
    That was FALSE. S6 never reaches the verification path (see residuals), so
    it stays green under B either way, and no measurement in this record
    discriminates B from C.
  - >
    D — reorder the release workflow so a tag carries its own metadata
    (explore 66, weak). Addresses the root construction and is impossible as
    stated - the archive hash is computed over the tree that would have to
    contain it. Any approximation is a release-process change, out of scope per
    the issue, and would not help installs that already exist.
  - >
    C — all-sources-must-agree (explore 81.5, solid). SELECTED. Differentiation
    across the four is 54 / 66 / 74 / 81.5, well beyond the 5% floor that would
    signal insufficiently distinct hypotheses.

anti_scope:
  - >
    Do NOT repurpose the placeholder sentinel. A `<`-prefixed expected_commit
    keeps its skip semantics under BOTH enforcement modes; it only becomes
    distinguishable from a verification in the summary line. It is safe BECAUSE
    the severity rule stops it masking another source's `absent`, not because a
    placeholder is inherently harmless.
  - >
    THE INTEGRITY SOURCE IS NOT CONFIGURABLE. No environment variable selects
    the ref the expected metadata is read from; it is `origin HEAD`.
    EIDOLONS_REPO already covers fork and test redirection, and an undocumented
    knob that redirects where trust comes from is not one this path should have.
  - >
    No change to the per-Eidolon member integrity path - verify.sh, doctor.sh,
    release_metadata_for, release_integrity_status,
    _verify_release_integrity_internal.
  - >
    No change to the release workflow ordering, no roster data changes, and NO
    CHANGE TO schemas/roster.schema.json. Requiring commit/tree/archive_sha256
    there is FILED AS A FOLLOW-UP and deliberately not done here - nothing
    validates the INSTALLED roster against the schema at read time, so a schema
    change closes nothing on the AC-21 local-write path while looking like a
    fix. The read-time classifier is the load-bearing repair.
  - >
    integrity_enforcement_mode ITSELF IS NOT CHANGED. AC-23 normalises at the
    upgrade_self.sh call site only. The same fail-open read remains on
    verify.sh:68 and doctor.sh:230, the frozen member-integrity path; FILED AS A
    FOLLOW-UP. The asymmetry is deliberate and recorded rather than silently
    created (risk R-6).
  - >
    No change to nexus_refresh's own contract, and no call to it added on the
    upgrade path.
  - >
    No new exit code. 5 (INTEGRITY_ERROR) covers every refusal; the header and
    --help tables stay accurate apart from the new flag.
  - >
    --check mode is NOT covered. It never clones, so it has no payload to
    verify. A distinct gap, recorded as a residual rather than closed.
  - >
    upgrade_self.bats S6 is NOT repaired, and neither is the self-inflicted
    dirty state behind it. Its missing exit-5 assertion is added as AC-11
    rather than by editing a test this change must also leave passing (AC-10).
    SHARPER EDGE - docs/cli-reference.md:31 ALREADY DOCUMENTS THIS FAILURE AS
    FIXED ("Without this heal, a freshly-backfilled .roster_ref caused eidolons
    upgrade self's dirty-tree check to refuse the upgrade until --force was
    passed") while the heal is precisely what leaves the tree dirty, by writing
    an untracked .gitignore. A documented fix that does not fix RETIRES THE
    SEARCH. That is how S6 sat vacuous while three artifacts described it
    correctly.
  - >
    CHANGELOG.md's historical entry (line 1764) repeats the integrity-verified
    claim and the flag/exit lists. It is FROZEN RELEASE HISTORY describing what
    v1.x shipped, not a live promise, and is not rewritten to satisfy a gate
    added afterwards - the same exclusion check_change_specs.sh makes for
    archive/. Recorded so the exclusion is a decision, not an oversight.
  - >
    The non-tag outcome (`skipped:non-tag`) PROCEEDS even under strict (OQ-4,
    ruled). A non-tag ref is an explicit --ref opt-in with no release record by
    construction, and refusing it would break the documented --ref <branch>
    workflow. The outcome makes it visible; turning it into a refusal is a
    separate decision. `skipped:non-tag` is the LABEL for that policy row - what
    the user sees is the display string `UNVERIFIED - non-tag ref`.

