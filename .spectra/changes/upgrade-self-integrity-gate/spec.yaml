discriminating_power: >
  Stated explicitly so no regression guard is sold as evidence of the fix.
  FAIL AGAINST PRE-FIX CODE - AC-1, AC-2, AC-3, AC-16, AC-17, AC-19, AC-20.
  FAIL AGAINST THE CURRENT (POST-FIX) IMPLEMENTATION, i.e. the 1.4.0 adversary
  round - AC-21, AC-22, AC-23, AC-25, and AC-24 which fails both pre-fix and
  today. Each was measured against the shipped code, not argued. They are not
  regression guards and must not be reported green until the code moves.
  PASS BOTH BEFORE AND AFTER (regression guards) - AC-10, AC-11, AC-15.
  REVISION 1.5.0 ADDS TWO MORE, AND THE MEASUREMENT IS DATED BECAUSE THE TREE HAS
  MOVED - AC-26 and AC-27 were measured against the working tree AS IT STANDS on
  2026-08-10, which already carries the 1.4.0 implementation work, so they fail
  against THAT and not merely against 933f36b. AC-26 was reproduced end to end
  (a reachable upstream reported as unreachable); AC-27 by forcing an
  out-of-contract return code (strict, no metadata, exit 0, integrity: verified).
  AC-15's surfaces already agree on 933f36b; it exists to stop them diverging
  when the new flag lands in two of the three.

rulings:
  - >
    OQ-2 (placeholder under strict) - KEEP THE SKIP. A placeholder has appeared
    in a nexus release block exactly once ever (the v1.0.0 bootstrap 98d3b40,
    filled by dbe17c4) and never since. Revision 1.0.0's stated REASON was
    wrong and is corrected - "an actor who can write that roster can also write
    matching hashes" holds only for an actor with ORIGIN control, not for
    local-file write. The skip is safe BECAUSE of the severity rule, which stops
    a placeholder masking another source's `absent`; without that rule it is a
    local-write downgrade.
  - >
    OQ-1 (a corrected metadata value) - POST-SHIP DOCUMENTATION, not a
    pre-implementation blocker. Base rate is zero across 20+ releases, the
    failure is loud, and two exits exist. What is owed before implementation is
    the stable-channel sentence now recorded in R-1.
  - >
    OQ-2 INTERACTION, RECORDED AT 1.4.0 AND NOT RE-DECIDED. The placeholder row
    is UNREACHABLE ON A FORWARD UPGRADE - the installed roster is always
    `absent` for a version it has never seen and absent > placeholder, so a
    genuine bootstrap-window release refuses under strict and reports (absent).
    AC-9/AC-9b reach that row only by hand-seeding a placeholder into BOTH
