acceptance_checks:
  - id: AC-1
    check: >
      THE GATE GOES RED ON THE DEFECT IT NAMES. Target metadata present
      upstream-only, served payload tampered (tag moved to a different commit
      after the record was written) => upgrade self refuses, exit 5, token
      `mismatch`, nexus.new removed, $NEXUS/VERSION unchanged.
    evidence: >
      new upgrade_self.bats scenario against the fixture remote. FAILS AGAINST
      PRE-FIX CODE, which exits 0 and completes the swap.
  - id: AC-2
    check: >
      CONTROL FOR AC-1 AND THE POSITIVE PATH. The same fixture with the tag not
      moved exits 0 and the summary reads `integrity: verified`.
    evidence: >
      same scenario, untampered arm. The pair shows the gate keys on the tamper
      and not on the setup. Also fails against pre-fix code, which prints
      `no release integrity metadata in roster — skipping verification`.
